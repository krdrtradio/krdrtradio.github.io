<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Sets</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="icon" type="image/png" href="https://krdrtradio.github.io/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #111827;
    color: white;
}

/* TOPBAR */
#topbar {
    height: 56px;
    background: #1f2937;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
}

#menuBtn {
    cursor: pointer;
    font-size: 22px;
}

/* SIDEBAR */
#sidebar {
    position: fixed;
    top: 0;
    left: -300px;
    width: 300px;
    height: 100%;
    background: #1f2937;
    padding: 12px;
    transform: translateX(-100%);
    transition: transform .3s ease;
    overflow-y: auto;
    z-index: 1000;
}

#sidebar.active {
    left: 0;
    transform: translateX(0);
}

/* OVERLAY */
#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 999;
}

#overlay.active {
    display: block;
}

/* SEARCH */
#setsSearch {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: none;
    border-radius: 8px;
    background: #374151;
    color: white;
}

/* DJ ITEM */
.station-item {
    padding: 10px;
    margin-bottom: 8px;
    background: #374151;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.station-item.active {
    background: #2563eb;
}

/* CONTENT */
#content {
    padding: 70px 16px 120px;
    max-width: 900px;
    margin: auto;
    padding-bottom: 120px;
}

@media (max-width: 768px) {
    #content {
        padding-bottom: 140px;
    }
}

/* TRACK */
.track-card {
    background: #1f2937;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
}

.track-title {
    margin-bottom: 8px;
}

/* LINK */
.link-btn {
    display: inline-block;
    background: #2563eb;
    padding: 8px 12px;
    border-radius: 8px;
    color: white;
    text-decoration: none;
}

/* FAVORITE */
.fav {
    cursor: pointer;
    color: gold;
}

/* MINI PLAYER */
#miniPlayer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1f2937;
    padding: 10px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 2000;
    box-shadow: 0 -2px 10px rgba(0,0,0,.3);
}

#globalText {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
}

#miniPlayer audio {
    flex: 1;
    min-width: 150px;
}

@media (max-width: 768px) {

#miniPlayer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    display: none;
    flex-direction: column;

    background: #1f2937;

    padding: 12px;

    z-index: 2000;

    border-top: 1px solid #374151;
    box-shadow: 0 -4px 12px rgba(0,0,0,.3);
}

#globalText {
    margin-bottom: 8px;

    font-size: 14px;
    font-weight: 600;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#miniPlayer audio {
    width: 100%;
}
}

.artist-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}

.artist-links a {
    color: #60a5fa;
    text-decoration: none;
    background: #1f2937;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 14px;
}

.artist-links a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>

<div id="topbar">
    <div id="menuBtn">☰</div>
    <div>🎧 DJ Sets</div>
    <button onclick="shuffleSets()">🔄</button>
</div>

<div id="sidebar">
    <input id="setsSearch" placeholder="Szukaj DJ-a...">
    <div id="set-container"></div>
</div>

<div id="overlay"></div>

<div id="content">
<h2 id="currentStation">Wybierz DJ</h2>
<div id="artistLinks" class="artist-links"></div>
<div id="tracksContainer"></div>
</div>

<div id="miniPlayer">
    <span>🎧</span>
    <span id="globalText"></span>
    <audio id="globalPlayer" controls></audio>
</div>

<script>
let sets = [];
let currentIndex = 0;

const favKey = "fav_djs";

/* MENU */
document.getElementById("menuBtn").onclick = () => {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
};

document.getElementById("overlay").onclick = () => {
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
};

/* LOAD JSON */
async function loadSets() {
    const res = await fetch("json/sets.json");
    sets = await res.json();

    buildList();
    renderArtist(0);
}

/* BUILD LIST */
function buildList() {
    const container = document.getElementById("set-container");
    container.innerHTML = "";

    const favs = JSON.parse(localStorage.getItem(favKey) || "[]");

    sets.forEach((dj, i) => {

        const div = document.createElement("div");
        div.className = "station-item";

        div.innerHTML = `
            <span>${dj.name}</span>
            <span class="fav">⭐</span>
        `;

        if (favs.includes(dj.name)) {
            div.querySelector(".fav").style.opacity = 1;
        } else {
            div.querySelector(".fav").style.opacity = 0.3;
        }

        /* CLICK DJ */
        div.addEventListener("click", (e) => {

            if (e.target.classList.contains("fav")) {
                toggleFav(dj.name);
                return;
            }

            setActive(i);
            renderArtist(i);
        });

        container.appendChild(div);
    });
}

/* FAVORITES */
function toggleFav(name) {
    let favs = JSON.parse(localStorage.getItem(favKey) || "[]");

    if (favs.includes(name)) {
        favs = favs.filter(f => f !== name);
    } else {
        favs.push(name);
    }

    localStorage.setItem(favKey, JSON.stringify(favs));
    buildList();
}

/* ACTIVE DJ */
function setActive(i) {
    currentIndex = i;

    document.querySelectorAll(".station-item")
        .forEach(el => el.classList.remove("active"));

    document.querySelectorAll(".station-item")[i]
        .classList.add("active");
}

/* RENDER DJ */
function renderArtist(i) {
    const dj = sets[i];

    document.getElementById("currentStation").textContent = dj.name;

    const container = document.getElementById("tracksContainer");
    container.innerHTML = "";
    
const artist = sets[i];

const links = document.getElementById("artistLinks");
links.innerHTML = "";

[
    ["youtube", "YouTube"],
    ["mixcloud", "Mixcloud"],
    ["soundcloud", "SoundCloud"],
    ["podcasts", "Podcasty"]
].forEach(([key, label]) => {

    if (artist[key]) {

        const a = document.createElement("a");

        a.href = artist[key];
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        a.textContent = label;

        links.appendChild(a);
    }
});

    dj.tracks.forEach((t, idx) => {

        const div = document.createElement("div");
        div.className = "track-card";

        let html = `<div class="track-title">${t.name}</div>`;

        if (t.audio) {
            html += `
                <button onclick="playTrack('${t.track}', ${i}, ${idx})">
                    ▶ Play
                </button>
            `;
        } else {
            html += `
                <a class="link-btn" href="${t.track}" target="_blank">
                    Otwórz link
                </a>
            `;
        }

        div.innerHTML = html;
        container.appendChild(div);
    });
}

/* GLOBAL PLAYER */
function playTrack(src, djIndex, trackIndex) {

    const player = document.getElementById("globalPlayer");
    const playerText = document.getElementById("globalText");
    const mini = document.getElementById("miniPlayer");

    const dj = sets[djIndex];
    const track = dj.tracks[trackIndex];

    player.src = src;
    player.play();

    // ✔️ tutaj ustawiamy tytuł
    playerText.textContent = track.name;

    mini.style.display = "flex";

    currentIndex = djIndex;
    window.currentTrackIndex = trackIndex;
}

/* AUTO NEXT */
document.getElementById("globalPlayer").addEventListener("ended", () => {

    const dj = sets[currentIndex];
    const next = (window.currentTrackIndex ?? 0) + 1;

    if (dj.tracks[next]) {
        playTrack(dj.tracks[next].track, currentIndex, next);
    }
});

/* SHUFFLE */
function shuffleSets() {
    sets.sort(() => Math.random() - 0.5);
    buildList();
    renderArtist(0);
}

/* SEARCH */
document.getElementById("setsSearch").addEventListener("input", function () {

    const q = this.value.toLowerCase();

    document.querySelectorAll(".station-item").forEach(el => {
        el.style.display =
            el.textContent.toLowerCase().includes(q)
                ? "flex"
                : "none";
    });
});

loadSets();
</script>

</body>
</html>
