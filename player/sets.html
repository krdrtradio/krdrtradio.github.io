<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sety DJ</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<link rel="icon" type="image/png" href="https://krdrtradio.github.io/favicon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#111827;
    color:#fff;
    min-height:100vh;
}

#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:56px;
    background:#1f2937;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 16px;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
}

#menuBtn{
    cursor:pointer;
    font-size:22px;
    user-select:none;
}

#sidebar{
    position:fixed;
    top:0;
    left:-320px;
    width:320px;
    height:100vh;
    background:#1f2937;
    transition:left .25s ease;
    z-index:1001;
    overflow-y:auto;
    padding:72px 12px 12px;
}

#sidebar.active{
    left:0;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    opacity:0;
    visibility:hidden;
    transition:.25s;
    z-index:1000;
}

#overlay.active{
    opacity:1;
    visibility:visible;
}

#content{
    max-width:900px;
    margin:0 auto;
    padding:72px 20px 20px;
}

select,
input{
    width:100%;
    padding:10px 12px;
    border:none;
    border-radius:8px;
    background:#374151;
    color:#fff;
    margin-bottom:10px;
}

.station-item{
    background:#374151;
    padding:12px;
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
    transition:.2s;
}

.station-item:hover{
    background:#4b5563;
}

.station-item.active{
    background:#2563eb;
}

.track-card{
    background:#1f2937;
    padding:16px;
    border-radius:10px;
    margin-bottom:12px;
}

.track-title{
    margin-bottom:12px;
    font-weight:600;
}

audio{
    width:100%;
}

button,
.link-btn{
    display:inline-block;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 14px;
    text-decoration:none;
    cursor:pointer;
}

button:hover,
.link-btn:hover{
    background:#1d4ed8;
}

#currentStation{
    margin-bottom:20px;
}

.artist-links{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.artist-links a{
    color:#60a5fa;
    text-decoration:none;
}

.artist-links a:hover{
    text-decoration:underline;
}

@media(max-width:768px){

    #sidebar{
        width:280px;
        left:-280px;
    }

    #content{
        padding-left:16px;
        padding-right:16px;
    }
}
</style>

</head>
<body>

<div id="topbar">
    <span id="menuBtn">☰</span>
    <span>🎧 Sety DJ</span>
</div>

<div id="sidebar">


<select id="setsSelect"></select>

<input
    type="text"
    id="setsSearch"
    placeholder="Szukaj DJ-a..."
>

<div id="set-container"></div>


</div>

<div id="overlay"></div>

<div id="content">


<h2 id="currentStation">
    Wybierz kategorię
</h2>

<div id="artistLinks" class="artist-links"></div>

<div id="tracksContainer"></div>


</div>

<script>
let sets = [];

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

menuBtn.addEventListener("click", () => {
    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
});

overlay.addEventListener("click", () => {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
});

async function loadSets(){

    try{

        const response = await fetch("json/sets.json");
        sets = await response.json();

        buildArtists();

    }catch(error){

        console.error(error);

        document.getElementById("tracksContainer").innerHTML =
            "<p>Nie udało się wczytać sets.json</p>";
    }
}

function buildArtists(){

    const select = document.getElementById("setsSelect");
    const container = document.getElementById("set-container");

    select.innerHTML = "";
    container.innerHTML = "";

    sets.forEach((artist,index)=>{

        const option = document.createElement("option");
        option.value = index;
        option.textContent = artist.name;
        select.appendChild(option);

        const item = document.createElement("div");
        item.className = "station-item";
        item.textContent = artist.name;

        item.addEventListener("click",()=>{

            document
                .querySelectorAll(".station-item")
                .forEach(el=>el.classList.remove("active"));

            item.classList.add("active");

            renderArtist(index);

            sidebar.classList.remove("active");
            overlay.classList.remove("active");
        });

        container.appendChild(item);
    });

    select.addEventListener("change",()=>{
        renderArtist(select.value);
    });

    renderArtist(0);
}

function renderArtist(index){

    const artist = sets[index];

    document.getElementById("currentStation")
        .textContent = artist.name;

    const links = document.getElementById("artistLinks");

    links.innerHTML = "";

    [
        ["youtube","YouTube"],
        ["mixcloud","Mixcloud"],
        ["soundcloud","SoundCloud"],
        ["podcasts","Podcasty"]
    ].forEach(([key,label])=>{

        if(artist[key]){

            const a = document.createElement("a");

            a.href = artist[key];
            a.target = "_blank";

            a.textContent = label;

            links.appendChild(a);
        }
    });

    const tracksContainer =
        document.getElementById("tracksContainer");

    tracksContainer.innerHTML = "";

    artist.tracks.forEach(track=>{

        const card = document.createElement("div");

        card.className = "track-card";

        let html =
            `<div class="track-title">${track.name}</div>`;

        if(track.audio){

            html += `
                <audio controls preload="none">
                    <source
                        src="${track.track}"
                        type="audio/mpeg">
                </audio>
            `;

        }else{

            html += `
                <a
                    class="link-btn"
                    href="${track.track}"
                    target="_blank"
                    rel="noopener noreferrer">
                    Otwórz link
                </a>
            `;
        }

        card.innerHTML = html;

        tracksContainer.appendChild(card);

    });
}

document
.getElementById("setsSearch")
.addEventListener("input",function(){

    const search = this.value.toLowerCase();

    document
    .querySelectorAll(".station-item")
    .forEach(item=>{

        item.style.display =
            item.textContent
                .toLowerCase()
                .includes(search)
                ? "block"
                : "none";
    });
});

loadSets();
</script>

</body>
</html>
