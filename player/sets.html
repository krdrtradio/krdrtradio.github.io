<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Sets</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="icon" type="image/png" href="https://krdrtradio.github.io/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style-sets.css">
</head>
<body>

<div id="topbar">
    <div id="menuBtn">☰</div>
    <div>🎧 DJ Sets</div>
    <button onclick="shuffleSets()">🔄</button>
</div>

<div id="sidebar">
    <input id="setsSearch" placeholder="Szukaj DJ-a...">
    <div id="set-container"></div>
</div>

<div id="overlay"></div>

<div id="content">
<div class="top-links">
    <a href="https://krdrtradio.github.io/">Wstecz</a> | <a href="https://krdrtradio.github.io/player">Radio</a> | <a href="https://www.beatport.com/">Beatport</a> | <a href="https://krdrtradio.github.io/player/info">Informacje</a>
</div>
<h2 id="currentStation">Wybierz DJ</h2>
<div id="artistLinks" class="artist-links"></div>
<div id="tracksContainer"></div>
</div>

<div id="miniPlayer">
    <span>🎧</span>
    <span id="globalText"></span>
    <audio id="globalPlayer" controls></audio>
</div>

<script src="app-sets.js"></script>

</body>
</html>
