<!DOCTYPE html>
<html>
   <head>
      <title>Lista artykułów | KrdrtRadio</title>
      <script src="/site-head.js"></script>
      <link rel="stylesheet" href="/style-def.css">
      <link rel="stylesheet" href="media.css">
   </head>
   <body>
      <div>
         <script src="/site-top.js"></script>
         <div class="overlay" id="overlay"></div>
         <main class="main-content">
            <script src="/site-tophead.js"></script>
            <section class="hero">
               <!-- To ID musi istnieć w momencie wywołania funkcji -->
               <p class="article_result" id="article-s-result"></p>
               <p class="article_result" id="article-c-result"></p>
               <p class="article_result_desc" id="article-desc-result"></p>
               <p class="article_result" id="article-t-result"></p>
               <p class="article_result" id="article-a-result"></p>
               <p class="article_result" id="article-d-result"></p>
               <div style="margin-left: 10px;" id="article-list">Ładowanie aktualności...</div>
               <button id="load-more-btn" style="display:none; margin: 20px auto; padding: 10px 20px; cursor: pointer;">Wczytaj więcej</button>
            </section>
            <script src="/site-bottom.js"></script>
         </main>
      </div>
      <script src="/script.js"></script>
      <script src="/script-def.js"></script>
      <script src="site-article.js"></script>
      <!-- Skrypt silnika artykułów na końcu -->
      <script src="articlelist-index.js"></script>
   </body>
</html>
