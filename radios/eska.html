    <style>
/* ============================== RADIO MAIN - Top menu ============================== */
 .radio-main {
	 background: #f8f8f8;
	/* light gray background */
	 padding: 15px 20px;
	 border-radius: 8px;
	 margin-bottom: 20px;
	/* space between menu and cards */
}
 .radio-main .station-list {
	 list-style: none;
	/* remove bullets */
	 display: flex;
	 flex-wrap: wrap;
	/* wrap on small screens */
	 gap: 10px;
	 padding: 0;
	 margin: 0;
}
 .radio-main .station-list li {
	 margin: 0;
}
 .radio-main .station-list li a {
	 display: block;
	/* full clickable area */
	 text-decoration: none;
	 color: #333;
	 font-weight: 500;
	 padding: 8px 12px;
	 border-radius: 6px;
	 transition: background 0.2s, color 0.2s;
}
 .radio-main .station-list li a:hover {
	 background: #e67e22;
	/* same orange as TIME SA header */
	 color: white;
}
/* ============================== RADIO CONTAINER - Grid of cards ============================== */
 .radio-container {
	 display: grid;
	 grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
	 gap: 20px;
	 padding: 20px;
}
/* ============================== RADIO CARD ============================== */
 .radio-card {
	 background: var(--card);
	 border-radius: 12px;
	 box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
	 overflow: hidden;
	 border: 1px solid #eee;
}
/* ============================== CARD HEADER ============================== */
 .card-header {
	 padding: 15px;
	 font-weight: bold;
	 text-align: center;
	 color: white;
	 text-transform: uppercase;
	 letter-spacing: 1px;
}
/* Colors for each group */
 .time-sa {
	 background: #e67e22;
}
/* Orange */
 .agora {
	 background: #e74c3c;
}
/* Red */
 .rmf {
	 background: #f1c40f;
	 color: #333;
}
/* Yellow */
 .inne {
	 background: #34495e;
}
/* Dark Blue */
/* ============================== STATION LIST INSIDE CARDS ============================== */
 .radio-card .station-list {
	 list-style: none;
	 padding: 0;
	 margin: 0;
}
 .radio-card .station-list li a {
	 display: block;
	 padding: 12px 15px;
	 color: var(--text);
	 background: var(--card);
	 text-decoration: none;
	 transition: background 0.3s, padding-left 0.3s;
	 border-bottom: 1px solid #f0f0f0;
}
 .radio-card .station-list li:last-child a {
	 border-bottom: none;
	 border-radius: 0 0 12px 12px;
	/* match card rounding */
}
 .radio-card .station-list li a:hover {
	 background: #f8f9fa;
	 padding-left: 20px;
	/* subtle shift effect */
	 cursor: pointer;
	 color: black;
}
/* ============================== RESPONSIVE ADJUSTMENTS ============================== */
 @media (max-width: 600px) {
	 .radio-main .station-list {
		 flex-direction: column;
		 gap: 8px;
	}
	 .radio-container {
		 grid-template-columns: 1fr;
		/* single column on small screens */
	}
}
 .but1 {
	 a {
		 text-decoration: none;
	}
}
/* 1. Ukryj radio */
 input[type="radio"] {
	 display: none;
}
/* 2. UKRYJ TREŚĆ WSZYSTKICH ZAKŁADEK DOMYŚLNIE */
 .content {
	 display: none;
	 padding: 20px 0;
	 border: 1px solid #ccc;
	 background: var(--card);
}
/* 3. POKAŻ TREŚĆ TYLKO ZAZNACZONEJ ZAKŁADKI */
 #r-tab1:checked~.r-tab1-content, #r-tab2:checked~.r-tab2-content {
	 display: block;
}
/* 4. Środkowanie i styl etykiet */
 .tabs-wrapper {
	 display: flex;
	 @media (max-width: 600px) {
		 justify-content: center;
	}
	 width: 100%;
}
 .tabs-wrapper > label {
	 padding: 10px 20px;
	 background: var(--card);
	 cursor: pointer;
	 border: 1px solid #ccc;
	 border-bottom: none;
	 transition: 0.2s 
}

	}

	}
}

}

// =====================
// DAY PARAMETER z URL

function getDayIdFromSlug(slug) {
    if (!slug) return null;

    const normalized = slug
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    const dayMap = {
        "pon": "1",
        "pn": "1",
        "po": "1",
        "1": "1",
        "wt": "2",
        "2": "2",
        "śro": "3",
        "sro": "3",
        "śr": "3",
        "sr": "3",
        "3": "3",
        "czw": "4",
        "cz": "4",
        "4": "4",
        "pt": "5",
        "pi": "5",
        "pią": "5",
        "pia": "5",
        "5": "5",
        "sob": "6",
        "sb": "6",
        "so": "6",
        "6": "6",
        "nd": "0",
        "ndz": "0",
        "n": "0",
        "nie": "0",
        "nied": "0",
        "niedz": "0",
        "7": "0",
        "0": "0"
    };

    return dayMap[normalized] || null;
}

function openDayFromURL() {
    const params = new URLSearchParams(window.location.search);
    const daySlug = params.get("day");
    const dayId = getDayIdFromSlug(daySlug);

    if (!dayId) return;

    document.querySelectorAll(".schedule_list").forEach(el => {
        el.style.display = "none";
    });

    document.querySelectorAll(".day_tablinks").forEach(btn => {
        btn.classList.remove("active");
    });

    const selectedTab = document.getElementById("day_" + dayId);

    if (selectedTab) {
        selectedTab.style.display = "block";
    }

    document.querySelectorAll(".day_tablinks").forEach(btn => {
        if (btn.textContent.trim() === dayNames[dayId]) {
            btn.classList.add("active");
        }
    });
}

const escapeHTML = (str) =>

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[m]))
        : "";

const HTMLStripper = (str) =>

        ? str.replace(/<\/?[^>]+(>|$)/g, "").replace(/\n/g, "")
        : "";

function formatHour(h) {

async function renderCurrent() {
    if (!SITE_ID || !CURRENT_STATION_ID) return;

    const params = new URLSearchParams({
        si: SITE_ID,
        st: CURRENT_STATION_ID
    });

    const url =
        `https://current-program.krdrtradio.workers.dev/?${params}`;

    try {
        const response = await fetch(url, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const payload = await response.json();

        const program =
            payload.program ||
            payload.current ||
            payload.data ||
            payload;

        const station =
            STATIONS.find(s => String(s.id ?? s.slug) === String(CURRENT_STATION_ID)) || {};

        const ui = {
            item: document.querySelector(".current_program_item"),
            hour: document.querySelector(".current_program_hour"),
            title: document.querySelector(".current_program_title"),
            host: document.querySelector(".current_program_host"),
            photo: document.querySelector(".current_program_photo"),
            track: document.getElementById("resultTrack")
        };

        const data = program.program_data || program.data || program;

        const title =
            program.name ||
            data.name ||
            program.title ||
            "Radio Online";

        if (ui.item) {
            ui.item.textContent = program.item || "";
        }

        if (ui.hour) {
            ui.hour.textContent =
                `${formatHour(program.hour_start)}${
                    program.hour_end
                        ? ` - ${formatHour(program.hour_end)}`
                        : ""
                }`;
        }

        if (ui.title) {
            ui.title.textContent = title;
        }

        const host = program.host || data.host || "";

        if (ui.host) {
            ui.host.textContent = Array.isArray(host)
                ? host.join(", ")
                : host;
        }

        const image =
            program.thumbnail_uri ||
            program.thumbnail ||
            data.thumbnail_uri ||
            data.thumbnail ||
            station.cover;

        if (ui.photo && image) {
            ui.photo.src = /^https?:\/\//i.test(image)
                ? image
                : `https://${image}`;

            ui.photo.alt = title;
        }

        if (ui.track) {
            ui.track.textContent =
                program.track ||
                program.song ||
                data.track ||
                "";
        }
    } catch (error) {
        console.error("Nie udało się pobrać aktualnego programu:", error);
    }
}

async function renderSchedules() {
    const tabs = document.getElementById("days");
    const contents = document.getElementById("day_contents");

    if (!tabs || !contents || !SITE_ID || !CURRENT_STATION_ID) {
        console.warn("Brakuje elementów ramówki lub identyfikatora stacji.");
        return;
    }

    const params = new URLSearchParams({
        si: SITE_ID,
        st: CURRENT_STATION_ID,
        onair: "true"
    });

    try {
        const [response, responseDetail] = await Promise.all([
            fetch(
                `https://schedule.krdrtradio.workers.dev/?${params}`,
                { cache: "no-store" }
            ),
            fetch(
                `https://schedule.krdrtradio.workers.dev/detail?${params}`,
                { cache: "no-store" }
            )
        ]);

        if (!response.ok) {
            throw new Error(`Ramówka: HTTP ${response.status}`);
        }

        if (!responseDetail.ok) {
            throw new Error(`Szczegóły: HTTP ${responseDetail.status}`);
        }

        const payload = await response.json();
        const detailPayload = await responseDetail.json();

        console.log("Ramówka API:", payload);
        console.log("Szczegóły API:", detailPayload);

        // Normalizacja odpowiedzi z ramówką.
        let days;

        if (Array.isArray(payload)) {
            days = payload;
        } else if (payload && Array.isArray(payload.data)) {
            days = payload.data;
        } else if (payload && Array.isArray(payload.schedule)) {
            days = payload.day !== undefined
                ? [payload]
                : payload.schedule;
        } else if (payload && payload.day !== undefined) {
            days = [payload];
        } else {
            days = [];
        }

        if (!days.length) {
            console.warn("API nie zwróciło dni ramówki:", payload);
            tabs.replaceChildren();
            contents.textContent = "Brak danych ramówki.";
            return;
        }

        // Normalizacja szczegółów audycji.
        let detailDays;

        if (Array.isArray(detailPayload)) {
            detailDays = detailPayload;
        } else if (detailPayload && Array.isArray(detailPayload.data)) {
            detailDays = detailPayload.data;
        } else if (detailPayload && detailPayload.day !== undefined) {
            detailDays = [detailPayload];
        } else {
            detailDays = [];
        }

        tabs.replaceChildren();
        contents.replaceChildren();

        days.forEach((entry, index) => {
            const dayId = String(entry.day ?? index);
            const label =
                dayNames?.[dayId] ||
                entry.name ||
                `Dzień ${dayId}`;

            const button = document.createElement("button");
            button.type = "button";
            button.className = "day_tablinks";
            button.textContent = label;

            button.addEventListener("click", () => {
                openDayTab({ currentTarget: button }, dayId);
            });

            tabs.appendChild(button);

            const panel = document.createElement("div");
            panel.id = `day_${dayId}`;
            panel.className = "schedule_list";
            panel.style.display = "none";

            const programs = Array.isArray(entry.schedule)
                ? entry.schedule
                : Array.isArray(entry.programs)
                    ? entry.programs
                    : [];

            programs.forEach(program => {
                const card = document.createElement("div");
                card.className = program.subschedule
                    ? "schedule_program small"
                    : "schedule_program";

                if (program.onair === true) {
                    card.classList.add("onair");
                }

                const thumbnail =
                    program.thumbnail_uri ||
                    program.thumbnail ||
                    program.thumb?.url ||
                    null;

                if (thumbnail || program.thumb?.name) {
                    const cover = document.createElement("div");
                    cover.className = "schedule_program_cover";

                    if (thumbnail) {
                        const img = document.createElement("img");
                        img.src = thumbnail;
                        img.alt = program.name || "Audycja";
                        img.loading = "lazy";
                        img.decoding = "async";
                        cover.appendChild(img);
                    } else {
                        cover.textContent = program.thumb.name;
                        if (program.thumb.background) {
                            cover.style.background =
                                program.thumb.background;
                        }
                        if (program.thumb.color) {
                            cover.style.color = program.thumb.color;
                        }
                    }

                    card.appendChild(cover);
                }

                const content = document.createElement("div");
                content.className = "schedule_program_content";

                const item = document.createElement("div");
                item.className = "schedule_program_item";
                item.textContent = program.item || "";

                const hours = document.createElement("div");
                hours.className = "schedule_program_data";
                hours.textContent =
                    `${formatHour(program.hour_start)} - ` +
                    `${formatHour(program.hour_end)}`;

                const heading = document.createElement("div");
                heading.className = "schedule_program_name";

                if (program.url) {
                    const link = document.createElement("a");
                    link.href = program.url;
                    link.textContent = program.name || "Audycja";
                    heading.appendChild(link);
                } else {
                    heading.textContent = program.name || "Audycja";
                }

                const host = document.createElement("div");
                host.className = "schedule_program_host";
                host.textContent = Array.isArray(program.host)
                    ? program.host.join(", ")
                    : (program.host || "");

                content.append(item, hours, heading, host);

                if (program.comment) {
                    const comment = document.createElement("div");
                    comment.className = "schedule_program_comment";
                    comment.textContent = program.comment;
                    content.appendChild(comment);
                }

                // Podprogramy, np. wejścia w ramach większej audycji.
                if (Array.isArray(program.subitems) &&
                    program.subitems.length) {
                    const list = document.createElement("ul");
                    list.className = "schedule_program_subs";

                    program.subitems.forEach(sub => {
                        const li = document.createElement("li");

                        const time = document.createElement("span");
                        time.className = "schedule_program_subs_hour";
                        time.textContent = sub.hour || "";

                        const name = document.createElement("span");
                        name.className = "schedule_program_subs_name";

                        if (sub.url) {
                            const link = document.createElement("a");
                            link.href = sub.url;
                            link.textContent = sub.name || "Audycja";
                            name.appendChild(link);
                        } else {
                            name.textContent = sub.name || "Audycja";
                        }

                        const subHost = document.createElement("span");
                        subHost.className = "schedule_program_subs_host";
                        subHost.textContent = sub.host || "";

                        li.append(time, name, subHost);
                        list.appendChild(li);
                    });

                    content.appendChild(list);
                }

                card.appendChild(content);
                panel.appendChild(card);
            });

            // Szczegóły dla tego samego dnia.
            const detailDay = detailDays.find(
                d => String(d.day) === dayId
            );

            const details = Array.isArray(detailDay?.detail)
                ? detailDay.detail
                : Array.isArray(detailDay?.schedule)
                    ? detailDay.schedule
                    : [];

            details.forEach(detail => {
                if (detail.active === false) return;

                if (
                    Array.isArray(detail.station) &&
                    !detail.station.some(
                        id => String(id) === String(CURRENT_STATION_ID)
                    )
                ) {
                    return;
                }

                const block = document.createElement("div");
                block.className = "sdetail_list_content";

                const name = document.createElement("div");
                name.className = "schedule_detail_name";

                if (detail.url) {
                    const link = document.createElement("a");
                    link.href = detail.url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = detail.name || "Audycja";
                    name.appendChild(link);
                } else {
                    name.textContent = detail.name || "Audycja";
                }

                const host = document.createElement("div");
                host.className = "schedule_detail_host";
                host.textContent = Array.isArray(detail.host)
                    ? detail.host.join(", ")
                    : (detail.host || "");

                const onair = document.createElement("div");
                onair.className = "schedule_detail_onair";
                onair.textContent = Array.isArray(detail.onair)
                    ? detail.onair.join(" · ")
                    : (detail.onair || "");

                block.append(name, host, onair);
                panel.appendChild(block);
            });

            if (!panel.children.length) {
                panel.textContent = "Brak audycji dla tego dnia.";
            }

            contents.appendChild(panel);
        });

        const today = String(NowZone().getDay());
        const initial = days.some(d => String(d.day) === today)
            ? today
            : String(days[0]?.day ?? "0");

        if (typeof switchScheduleDay === "function") {
            switchScheduleDay(initial);
        } else {
            const firstButton = tabs.querySelector("button");
            if (firstButton) {
                openDayTab(
                    { currentTarget: firstButton },
                    initial
                );
            }
        }
    } catch (error) {
        console.error("Nie udało się pobrać ramówki:", error);
        contents.textContent =
            "Nie udało się wczytać ramówki. Spróbuj ponownie później.";
    }
}

function initDefaultTab() {
    const currentDay = NowZone().getDay().toString();
    openTab(null, currentDay);
}

function switchScheduleDay(dayId) {
    document.querySelectorAll(".schedule_list").forEach(el => {
        el.style.display = "none";
    });

    const selectedDay = document.getElementById(`day_${dayId}`);

    if (selectedDay) {
        selectedDay.style.display = "block";
    }

    document.querySelectorAll(".day_tab_btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.day === dayId);
    });
}

// Filtrowanie ramówki według nazwy audycji lub prowadzącego.
function renderSchedule() {
    const query = (document.getElementById("scheduleSearchInput")?.value || "")
        .trim()
        .toLocaleLowerCase("pl");

    document.querySelectorAll("#day_contents .schedule_program").forEach(card => {
        const matches = card.textContent.toLocaleLowerCase("pl").includes(query);
        card.style.display = matches ? "" : "none";

async function renderPrograms() {
    const container = document.getElementById("program_list");

    if (!container || !SITE_ID || !CURRENT_STATION_ID) return;

    const search = (
        document.getElementById("programSearchInput")?.value || ""
    ).trim().toLocaleLowerCase("pl");

    const params = new URLSearchParams({
        si: SITE_ID,
        st: CURRENT_STATION_ID
    });

    try {
        const response = await fetch(
            `https://contentlist.krdrtradio.workers.dev/?${params}`,
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const payload = await response.json();

        const items = Array.isArray(payload)
            ? payload
            : (payload.programs || payload.content || payload.data || []);

        container.replaceChildren();

        items
            .filter(p => {
                const host = Array.isArray(p.host)
                    ? p.host.join(" ")
                    : (p.host || "");

                return `${p.name || ""} ${host}`
                    .toLocaleLowerCase("pl")
                    .includes(search);
            })
            .forEach(p => {
                const card = document.createElement("article");
                card.className = "program_list_content";

                const name = document.createElement("a");
                name.className = "program_list_name";
                name.textContent = p.name || "Program";

                name.href = p.url_immediately || p.url ||
                    `program?uid=${encodeURIComponent(p.id || p.uid || "")}` +
                    `&st=${encodeURIComponent(SITE_ID)}`;

                name.target = "_blank";
                name.rel = "noopener noreferrer";

                const host = document.createElement("div");
                host.className = "program_list_host";
                host.textContent = Array.isArray(p.host)
                    ? p.host.join(", ")
                    : (p.host || "");

                const desc = document.createElement("div");
                desc.className = "program_list_desc";
                desc.textContent = p.description || "";

                card.append(name, host);

                if (desc.textContent) {
                    card.appendChild(desc);
                }

                container.appendChild(card);
            });
    } catch (error) {
        console.error("Błąd listy programów:", error);
        container.textContent = "Nie udało się wczytać programów.";
    }
}

// =====================
// WYBÓR STACJI
// =====================

async function renderStations(stationId = null) {
    try {
        const siteName =
            SITE_ID ||
            new URLSearchParams(window.location.search).get("name") ||
            "eska";

        const url =
            "https://station.krdrtradio.workers.dev/?si=" +
            encodeURIComponent(siteName);

        const response = await fetch(url, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const payload = await response.json();

STATIONS = Array.isArray(payload)
    ? payload
    : payload.station ||
      payload.stations ||
      payload.data?.station ||
      payload.data ||
      payload.results ||
      [];

if (!Array.isArray(STATIONS) || STATIONS.length === 0) {
    console.error("API nie zwróciło żadnych stacji:", payload);
    return;
}

const station = STATIONS.find(s =>
    String(s.id) === String(stationId) ||
    String(s.slug) === String(stationId)
) || STATIONS[0];

        CURRENT_STATION = station;
        CURRENT_STATION_ID = station.id ?? station.slug;

        const stationSelect = document.getElementById("stationSelect");

        if (stationSelect) {
            stationSelect.replaceChildren();

            STATIONS.forEach(item => {
                const option = document.createElement("option");
                option.value = String(item.id ?? item.slug ?? "");
                option.textContent = item.name || item.title || "Stacja";
                option.selected =
                    option.value === String(CURRENT_STATION_ID);

                stationSelect.appendChild(option);
            });

            if (!stationSelect.dataset.bound) {
                stationSelect.addEventListener("change", () => {
                    renderStations(stationSelect.value);
                });
                stationSelect.dataset.bound = "true";
            }
        }

        const title =
            document.getElementById("station_name") ||
            document.querySelector(".station_name");

        if (title) {
            title.textContent = station.name || station.title || "";
        }

        const cover =
            document.getElementById("station_cover") ||
            document.querySelector(".station_cover");

        const image =
            station.cover ||
            station.image ||
            station.thumbnail ||
            station.logo;

        if (cover && image) {
            cover.src = image;
            cover.alt = station.name || station.title || "Stacja radiowa";
        }

        const streamUrl =
            station.stream ||
            station.stream_url ||
            station.url ||
            station.audio_url;

        if (streamUrl) {
            AudioPlayer(streamUrl);
        } else {
            console.warn("Wybrana stacja nie ma adresu strumienia.");
        }

        ButtonsSites();

        await Promise.allSettled([
            renderCurrent(),
            renderSchedules(),
            renderPrograms(),
            renderPodcasts(),
            renderPersons()
        ]);
    } catch (error) {
        console.error("Nie udało się pobrać listy stacji:", error);
    }
}

// =====================
// ODTWARZACZ AUDIO
// =====================

function getAudioElement() {
    return (
        document.getElementById("audio") ||
        document.getElementById("audio_player") ||
        document.querySelector("audio")
    );
}

function AudioPlayer(url) {
    const audio = getAudioElement();

    if (!audio) {
        console.error("Nie znaleziono elementu audio w HTML.");
        return;
    }

    if (!url || typeof url !== "string") {
        console.error("Nieprawidłowy adres strumienia audio.");
        return;
    }

    let parsedUrl;

    try {
        parsedUrl = new URL(url, window.location.href);
    } catch {
        console.error("Nie można odczytać adresu strumienia:", url);
        return;
    }

    if (!["http:", "https:"].includes(parsedUrl.protocol)) {
        console.error("Niedozwolony protokół strumienia.");
        return;
    }

    CURRENT_STREAM_URL = parsedUrl.href;

    // Zatrzymaj poprzedni strumień.
    audio.pause();

    if (hlsInstance) {
        try {
            hlsInstance.destroy();
        } catch (error) {
            console.warn("Błąd zamykania poprzedniego HLS:", error);
        }

        hlsInstance = null;
    }

    audio.removeAttribute("src");
    audio.load();

    // Jeśli strumień korzysta z HLS.
    const isHls = /\.m3u8(?:$|[?#])/i.test(CURRENT_STREAM_URL);

    if (
        isHls &&
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ) {
        hlsInstance = new Hls();

        hlsInstance.loadSource(CURRENT_STREAM_URL);
        hlsInstance.attachMedia(audio);

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
            if (data && data.fatal) {
                console.error("Krytyczny błąd HLS:", data);

                try {
                    hlsInstance.destroy();
                } catch {}

                hlsInstance = null;
            }
        });

        return;
    }

    // Natywne HLS, np. Safari.
    if (
        isHls &&
        audio.canPlayType("application/vnd.apple.mpegurl")
    ) {
        audio.src = CURRENT_STREAM_URL;
        audio.load();
        return;
    }

    // Zwykły strumień audio.
    // Używaj proxy tylko wtedy, gdy jest ono skonfigurowane
    // i obsługuje konkretny adres źródłowy.
    audio.src = CURRENT_STREAM_URL;
    audio.load();
}

// =====================
// ODTWARZANIE / PAUZA
// =====================

async function PlayAudio() {
    const audio = getAudioElement();

    if (!audio) return;

    try {
        await audio.play();
    } catch (error) {
        console.error("Nie udało się rozpocząć odtwarzania:", error);
    }
}

function PauseAudio() {
    const audio = getAudioElement();

    if (audio) {
        audio.pause();
    }
}

async function ToggleAudio() {
    const audio = getAudioElement();

    if (!audio) return;

    if (audio.paused) {
        await PlayAudio();
    } else {
        PauseAudio();
    }
}

// =====================
// PONOWNE POŁĄCZENIE
// =====================

function ReloadAudio() {
    if (!CURRENT_STREAM_URL) {
        const station = CURRENT_STATION;

        if (station) {
            CURRENT_STREAM_URL =
                station.stream ||
                station.stream_url ||
                station.url ||
                station.audio_url ||
                "";
        }
    }

    if (!CURRENT_STREAM_URL) {
        console.warn("Brak adresu strumienia do ponownego połączenia.");
        return;
    }

    AudioPlayer(CURRENT_STREAM_URL);
    PlayAudio();
}

// =====================
// PRZYCISK ODTWARZANIA
// =====================

function setupAudioControls() {
    const playButton =
        document.getElementById("play") ||
        document.getElementById("play_button") ||
        document.querySelector(".play_button");

    const pauseButton =
        document.getElementById("pause") ||
        document.getElementById("pause_button") ||
        document.querySelector(".pause_button");

    const toggleButton =
        document.getElementById("toggle_audio");

    const reloadButton =
        document.getElementById("reload_audio") ||
        document.getElementById("reload_button");

    if (playButton) {
        playButton.addEventListener("click", PlayAudio);
    }

    if (pauseButton) {
        pauseButton.addEventListener("click", PauseAudio);
    }

    if (toggleButton) {
        toggleButton.addEventListener("click", ToggleAudio);
    }

    if (reloadButton) {
        reloadButton.addEventListener("click", ReloadAudio);
    }
}

// =====================
// OBSŁUGA BŁĘDÓW AUDIO
// =====================

function setupAudioEvents() {
    const audio = getAudioElement();

    if (!audio) return;

    audio.addEventListener("playing", () => {
        document.body.classList.add("audio-playing");
        document.body.classList.remove("audio-error");
    });

    audio.addEventListener("pause", () => {
        document.body.classList.remove("audio-playing");
    });

    audio.addEventListener("waiting", () => {
        document.body.classList.add("audio-loading");
    });

    audio.addEventListener("playing", () => {
        document.body.classList.remove("audio-loading");
    });

    audio.addEventListener("error", () => {
        document.body.classList.remove("audio-loading");
        document.body.classList.add("audio-error");

        console.error(
            "Błąd odtwarzania. Sprawdź adres strumienia, CORS i dostępność serwera."
        );
    });
}

// INICJALIZACJA
