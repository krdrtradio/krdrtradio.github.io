<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra Wisielec - 244 Kategorie</title>
    <link rel="stylesheet" href="hangman.css">
</head>
<body>
    <div class="container">
        <h1>Gra Wisielec</h1>
        <p>Odgadnij ukryte słowo, wybierając litery!</p>
        <!-- Pasek statystyk -->
        <div class="stats-bar">
            <div>Kategoria: <span id="category-display">-</span></div>
            <div>Punkty: <span id="score-display">0</span></div>
        </div>
        <!-- Szubienica -->
        <div id="gallows"></div>
        <!-- Ukryte hasło -->
        <div id="word-display"></div>
        <!-- Komunikaty -->
        <div id="message"></div>
        <!-- Klawiatura -->
        <div id="alphabet"></div>
        <!-- Przyciski akcji -->
        <button id="reset-btn" class="btn" onclick="initGame()">Zagraj ponownie</button>
        <button id="edit-btn" class="btn action-btn" onclick="openModal()">Edytuj Słowa</button>
    </div>
    <!-- Okno edycji haseł (Modal) -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <button class="btn close-modal-btn" onclick="closeModal()">Zamknij</button>
            <h2>Panel Edycji Słów</h2>
            <div class="form-group">
                <label>Aktualna lista słów w bazie:</label>
                <div id="words-in-database" class="word-list"></div>
            </div>
            <hr>
            <h3>Dodaj nowe słowo</h3>
            <div class="form-group">
                <label for="new-word">Słowo:</label>
                <input type="text" id="new-word" placeholder="np. BANAN" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label for="new-category">Kategoria:</label>
                <select id="new-category">
                    <!-- Kategorie ładowane dynamicznie przez JavaScript -->
                </select>
            </div>
            <button class="btn" style="background-color: #2ecc71; color: white; width: 100%;" onclick="addNewWord()">Dodaj Słowo</button>
        </div>
    </div>
    <script src="hangman.js"></script>
</body>
</html>
