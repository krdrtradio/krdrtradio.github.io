<!DOCTYPE html>
<html lang="pl">
   <head>
      <meta charset="UTF-8">
      <script src="https://krdrtradio.github.io/site-head.js"></script>
      <meta name="viewport"
         content="width=device-width, initial-scale=1.0">
      <title>Notification System</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
      <link rel="stylesheet" href="messages.css">
   </head>
   <body>
      <div class="container">
         <!-- =====================================================
            TITLE
            ====================================================== -->
         <h3 id="title">Notification System</h3>
         <!-- =====================================================
            TOP BAR
            ====================================================== -->
         <div class="top-bar">
            <select id="languageSelect" onchange="setLanguage()">
               <option value="pl" selected>Polski</option>
               <option value="en">English</option>
            </select>
            <button onclick="toggleTheme()">🌙 Theme</button>
         </div>
         <!-- =====================================================
            TEXTAREA
            ====================================================== -->
         <textarea id="messageText" placeholder="Write messages here..."></textarea>
         <!-- =====================================================
            OPTIONS
            ====================================================== -->
         <div class="options">
            <label>
            <input type="checkbox" id="SendMessageImmediate">
            <span id="immediateLabel">Immediate</span>
            </label>
            <label>
            <input type="checkbox" id="urgentMode">
            <span id="urgentLabel">Urgent</span>
            </label>
         </div>
         <!-- =====================================================
            BUTTONS
            ====================================================== -->
         <div class="buttons">
            <button id="sendBtn" onclick="SendMessage()">Send</button>
            <button id="pauseBtn" onclick="pauseQueue()">Pause</button>
            <button id="resumeBtn" onclick="resumeQueue()">Resume</button>
            <button id="toggleBtn" onclick="toggleHistory()">Show / Hide History</button>
            <button id="clearBtn" onclick="clearHistory()">Clear History</button>
         </div>
         <!-- =====================================================
            HISTORY
            ====================================================== -->
         <div id="history" class="hidden"></div>
      </div>
      <!-- =========================================================
         NOTIFICATIONS
         ========================================================= -->
      <div id="notify-wrapper"></div>
      <script src="messages.js"></script>
   </body>
</html>
