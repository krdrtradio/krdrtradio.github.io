<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<script src="https://krdrtradio.github.io/site-head.js"></script>
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Notification System</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #1f2937;

    --primary: #4f46e5;
    --primary-hover: #4338ca;

    --danger: #dc2626;

    --border: #dbe1ea;

    --shadow:
        0 10px 30px rgba(0,0,0,0.08);
}

/* =========================================================
   DARK THEME
========================================================= */

body.dark {

    --bg: #111827;
    --card: #1f2937;
    --text: #f3f4f6;

    --primary: #6366f1;
    --primary-hover: #818cf8;

    --border: #374151;

    --shadow:
        0 10px 30px rgba(0,0,0,0.35);
}

/* =========================================================
   BODY
========================================================= */

body {

    font-family: "Univia Pro", "SF Pro Display", "Google Sans Flex", 'Inter', Arial, sans-serif;

    background: var(--bg);

    color: var(--text);

    padding: 20px;

    transition:
        background .3s,
        color .3s;
}

/* =========================================================
   CONTAINER
========================================================= */

.container {

    max-width: 600px;
}

/* =========================================================
   TITLE
========================================================= */

h3 {

    font-size: 30px;

    margin-bottom: 20px;
}

/* =========================================================
   TOP BAR
========================================================= */

.top-bar {

    display: flex;

    align-items: center;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 20px;
}

/* =========================================================
   SELECT
========================================================= */

select {

    padding: 10px 14px;

    border-radius: 12px;

    border: 1px solid var(--border);

    background: var(--card);

    color: var(--text);

    outline: none;
}

/* =========================================================
   TEXTAREA
========================================================= */

textarea {

    width: 100%;

    height: 140px;

    resize: vertical;

    padding: 14px;

    border-radius: 16px;

    border: 1px solid var(--border);

    background: var(--card);

    color: var(--text);

    font-size: 15px;

    outline: none;

    box-shadow: var(--shadow);

    transition: .2s;
}

textarea:focus {

    border-color: var(--primary);
}

/* =========================================================
   OPTIONS
========================================================= */

.options {

    margin-top: 16px;
}

label {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 10px;
}

/* =========================================================
   BUTTONS
========================================================= */

.buttons {

    margin-top: 20px;
}

button {

    background: var(--primary);

    color: white;

    border: none;

    padding: 11px 16px;

    border-radius: 14px;

    cursor: pointer;

    margin: 5px;

    font-weight: bold;

    transition:
        transform .15s,
        background .2s;

    box-shadow: var(--shadow);
}

button:hover {

    background: var(--primary-hover);

    transform: translateY(-2px);
}

/* =========================================================
   NOTIFICATION WRAPPER
========================================================= */

#notify-wrapper {

    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 9999;
}

/* =========================================================
   MESSAGE BOX
========================================================= */

.message-box {

    background: var(--card);

    color: var(--text);

    padding: 14px 18px;

    margin-top: 12px;

    border-radius: 18px;

    min-width: 260px;

    text-align: center;

    border: 1px solid var(--border);

    box-shadow: var(--shadow);

    backdrop-filter: blur(10px);
}

/* =========================================================
   HISTORY
========================================================= */

#history {

    margin-top: 40px;

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 16px;

    background: var(--card);

    box-shadow: var(--shadow);

    line-height: 1.8;
}

/* =========================================================
   HIDDEN
========================================================= */

.hidden {

    display: none;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    button {

        width: 100%;
    }

    .top-bar {

        flex-direction: column;
        align-items: stretch;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h3 id="title">
        Notification System
    </h3>

    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="top-bar">

        <select
            id="languageSelect"
            onchange="setLanguage()">

            <option value="pl" selected>
                Polski
            </option>

            <option value="en">
                English
            </option>

        </select>

        <button onclick="toggleTheme()">
            🌙 Theme
        </button>

    </div>

    <!-- =====================================================
         TEXTAREA
    ====================================================== -->

    <textarea
        id="messageText"
        placeholder="Write messages here..."></textarea>

    <!-- =====================================================
         OPTIONS
    ====================================================== -->

    <div class="options">

        <label>

            <input
                type="checkbox"
                id="SendMessageImmediate">

            <span id="immediateLabel">
                Immediate
            </span>

        </label>

        <label>

            <input
                type="checkbox"
                id="urgentMode">

            <span id="urgentLabel">
                Urgent
            </span>

        </label>

    </div>

    <!-- =====================================================
         BUTTONS
    ====================================================== -->

    <div class="buttons">

        <button
            id="sendBtn"
            onclick="SendMessage()">

            Send

        </button>

        <button
            id="pauseBtn"
            onclick="pauseQueue()">

            Pause

        </button>

        <button
            id="resumeBtn"
            onclick="resumeQueue()">

            Resume

        </button>

        <button
            id="toggleBtn"
            onclick="toggleHistory()">

            Show / Hide History

        </button>

        <button
            id="clearBtn"
            onclick="clearHistory()">

            Clear History

        </button>

    </div>

    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <div
        id="history"
        class="hidden"></div>

</div>

<!-- =========================================================
     NOTIFICATIONS
========================================================= -->

<div id="notify-wrapper"></div>

<script>

/* =========================================================
   GLOBALS
========================================================= */

const queue = [];

let running = false;

let paused = false;

let history = [];

/* =========================================================
   HELPERS
========================================================= */

const sleep = ms =>
    new Promise(res => setTimeout(res, ms));

/* =========================================================
   LANGUAGE SYSTEM
========================================================= */

const translations = {

    en: {

        title: "Notification System",

        send: "Send",

        pause: "Pause",

        resume: "Resume",

        toggle: "Show / Hide History",

        clear: "Clear History",

        immediate: "Immediate",

        urgent: "Urgent",

        placeholder:
            "Write messages here..."
    },

    pl: {

        title: "System Powiadomień",

        send: "Wyślij",

        pause: "Pauza",

        resume: "Wznów",

        toggle:
            "Pokaż / Ukryj Historię",

        clear:
            "Wyczyść Historię",

        immediate: "Natychmiast",

        urgent: "Pilne",

        placeholder:
            "Wpisz wiadomości tutaj..."
    }
};

/* =========================================================
   SET LANGUAGE
========================================================= */

function setLanguage() {

    const lang =
        document.getElementById(
            "languageSelect"
        ).value;

    const t = translations[lang];

    document.getElementById("title")
        .innerText = t.title;

    document.getElementById("sendBtn")
        .innerText = t.send;

    document.getElementById("pauseBtn")
        .innerText = t.pause;

    document.getElementById("resumeBtn")
        .innerText = t.resume;

    document.getElementById("toggleBtn")
        .innerText = t.toggle;

    document.getElementById("clearBtn")
        .innerText = t.clear;

    document.getElementById("immediateLabel")
        .innerText = t.immediate;

    document.getElementById("urgentLabel")
        .innerText = t.urgent;

    document.getElementById("messageText")
        .placeholder = t.placeholder;
}

/* =========================================================
   THEME
========================================================= */

function toggleTheme() {

    document.body.classList.toggle("dark");
}

/* =========================================================
   HISTORY
========================================================= */

function addHistory(msg) {

    history.push(msg);

    document.getElementById("history")
        .innerHTML =
            history
            .map(m => "🧾 " + m)
            .join("<br>");
}

function clearHistory() {

    history = [];

    document.getElementById("history")
        .innerHTML = "";
}

function toggleHistory() {

    document.getElementById("history")
        .classList.toggle("hidden");
}

/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(msg) {

    const wrapper =
        document.getElementById(
            "notify-wrapper"
        );

    const box =
        document.createElement("div");

    box.className =
        "message-box animate__animated animate__bounceInDown";

    box.innerText = msg;

    wrapper.appendChild(box);

    // OUT ANIMATION
    setTimeout(() => {

        box.classList.remove(
            "animate__bounceInDown"
        );

        box.classList.add(
            "animate__bounceOutUp"
        );

        box.addEventListener(
            "animationend",

            () => {

                box.remove();

            },

            { once: true }
        );

    }, 2000);

    addHistory(msg);
}

/* =========================================================
   PROCESS QUEUE
========================================================= */

async function processQueue() {

    if (running) return;

    running = true;

    try {

        while (queue.length > 0) {

            // PAUSE
            if (paused) {

                await sleep(300);

                continue;
            }

            const msg =
                queue.shift();

            showMessage(msg);

            await sleep(2500);
        }

    } finally {

        running = false;
    }
}

/* =========================================================
   SEND MESSAGE
========================================================= */

function SendMessage() {

    const text =
        document.getElementById(
            "messageText"
        ).value;

    if (!text.trim()) return;

    const immediate =
        document.getElementById(
            "SendMessageImmediate"
        ).checked;

    const urgent =
        document.getElementById(
            "urgentMode"
        ).checked;

    const lines = text
        .split("\n")
        .filter(l => l.trim() !== "");

    /* =====================================================
       IMMEDIATE MODE
    ===================================================== */

    if (immediate) {

        document.getElementById(
            "notify-wrapper"
        ).innerHTML = "";

        queue.length = 0;

        lines.forEach(line => {

            showMessage(

                urgent
                ? "🔴 " + line
                : line
            );

        });

        return;
    }

    /* =====================================================
       URGENT
    ===================================================== */

    if (urgent) {

        [...lines]
        .reverse()
        .forEach(line => {

            queue.unshift(
                "🔴 " + line
            );

        });

    }

    /* =====================================================
       NORMAL
    ===================================================== */

    else {

        lines.forEach(line => {

            queue.push(line);

        });
    }

    processQueue();
}

/* =========================================================
   PAUSE / RESUME
========================================================= */

function pauseQueue() {

    paused = true;
}

function resumeQueue() {

    paused = false;
}

/* =========================================================
   DEFAULT LANGUAGE
========================================================= */

setLanguage();

</script>

</body>
</html>
