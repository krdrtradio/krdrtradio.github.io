<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KRDRT Player Pro</title>

<style>
body{
    margin:0;
    font-family:system-ui,Arial;
    background:#0b0b0b;
    color:#fff;
}

header{
    padding:15px;
    background:#121212;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

input{
    width:40%;
    padding:8px;
    border-radius:6px;
    border:none;
}

.container{
    padding:15px;
    max-width:1100px;
    margin:auto;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:12px;
}

.card{
    background:#181818;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
    position:relative;
}

.card:hover{ transform:scale(1.03); }

.card img{
    width:100%;
    height:130px;
    object-fit:cover;
}

.card-body{ padding:10px; }

.small{ font-size:12px; color:#aaa; }

.section{
    background:#161616;
    padding:12px;
    margin-bottom:12px;
    border-radius:10px;
}

button{
    border:none;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
}

.fav{ position:absolute; top:8px; right:8px; background:#ffcc00; }

.nowticker{
    background:#1e1e1e;
    padding:8px;
    border-radius:8px;
    margin-bottom:10px;
    font-size:14px;
}

audio{ width:100%; margin-top:5px; }

.hidden{ display:none; }

</style>
</head>

<body>

<header>
    <div>🎧 KRDRT PRO</div>
    <input id="search" placeholder="Search stations or lists...">
</header>

<div class="container">

<div id="ticker" class="nowticker">Loading current program...</div>

<div id="app">Loading...</div>

</div>

<script>

/* ---------------- STATE ---------------- */

let stations = [];
let favorites = JSON.parse(localStorage.getItem("fav") || "[]");

const app = document.getElementById("app");
const ticker = document.getElementById("ticker");

const params = new URLSearchParams(location.search);
const st = params.get("st");
const id = params.get("id");
const sub = params.get("sub_id");

/* ---------------- INIT ---------------- */

init();

async function init(){

    await loadStations();

    setupSearch();

    if(!st){
        renderHome();
        return;
    }

    if(!id){
        renderStations();
        return;
    }

    const station = findStation(id);

    if(!station){
        app.innerHTML = "Not found";
        return;
    }

    if(sub){
        renderStation(resolveSub(station, sub));
    } else {
        renderStation(station);
    }

    startTicker(station);
}

/* ---------------- LOAD ---------------- */

async function loadStations(){

    const cache = localStorage.getItem("stations_cache");

    if(cache){
        stations = JSON.parse(cache);
    }

    try{
        const res = await fetch(
`https://krdrtradio.github.io/player_beta/json/${st}_stations.json`
        );

        stations = await res.json();

        localStorage.setItem("stations_cache", JSON.stringify(stations));

    }catch{}
}

/* ---------------- FIND ---------------- */

function findStation(id){

    for(const s of stations){
        if(s.id === id) return s;

        for(const l of (s.lists||[])){
            if(slug(l.name) === id){
                return {...s, ...l};
            }
        }
    }

    return null;
}

/* ---------------- SUB ITEM ---------------- */

function resolveSub(s, sub){

    const item = (s.lists||[])
        .find(x => slug(x.name) === sub);

    if(!item) return s;

    return {
        ...s,
        ...item,
        streams: item.streams || s.streams,
        schedule: item.schedule || s.schedule,
        podcast: item.podcast || s.podcast
    };
}

/* ---------------- HOME ---------------- */

function renderHome(){

    app.innerHTML = `
        <div class="section">
            <h2>Categories</h2>
            <a href="?st=test">Test</a>
        </div>
    `;
}

/* ---------------- STATIONS ---------------- */

function renderStations(){

    app.innerHTML = `
    <div class="grid">
    ${stations.map(s => `
        <div class="card" onclick="go('${s.id}')">

            <img src="${s.thumbnail_uri||''}">

            <div class="card-body">
                <b>${s.name}</b>
                <div class="small">${s.frequency||""}</div>
            </div>

            <button class="fav"
                onclick="toggleFav(event,'${s.id}')">
                ★
            </button>

        </div>
    `).join("")}
    </div>`;
}

function go(id){
    location.href = `?st=${st}&id=${id}`;
}

/* ---------------- STATION PAGE ---------------- */

async function renderStation(s){

    const streams = s.streams || {};

    let program = await getProgram(s);
    let podcasts = await getPodcasts(s);

    app.innerHTML = `

    <div class="section">
        <h2>${s.name}</h2>
        <div class="small">${s.frequency||""}</div>
    </div>

    <div class="section">
        <h3>Now Playing</h3>
        <div id="now">${program}</div>
    </div>

    <div class="section">
        <h3>Player</h3>

        ${streams.lq ? `
            <div>LQ
            <audio controls src="${streams.lq}"></audio></div>` : ""}

        ${streams.hq ? `
            <div>HQ
            <audio controls src="${streams.hq}"></audio></div>` : ""}
    </div>

    <div class="section">
        <h3>Podcasts</h3>
        ${podcasts}
    </div>

    <div class="section">
        <h3>Lists</h3>
        ${(s.lists||[]).map(l => `
            <a href="?st=${st}&id=${s.id}&sub_id=${slug(l.name)}">
                • ${l.name}
            </a><br>
        `).join("")}
    </div>

    `;
}

/* ---------------- CURRENT PROGRAM ---------------- */

async function getProgram(s){

    try{
        if(!s.schedule) throw 0;

        const url =
`https://current-program.krdrtradio.workers.dev/?si=${s.schedule.site}&st=${s.schedule.station}`;

        const r = await fetch(url);
        const j = await r.json();

        return `${j.name||""} - ${j.host||""}`;

    }catch{

        return "Radio Plug";
    }
}

/* ---------------- PODCASTS ---------------- */

async function getPodcasts(s){

    if(!s.podcast) return "No podcasts";

    try{
        const r = await fetch(
`https://podcasts.krdrtradio.workers.dev/?si=${s.podcast}`
        );

        const data = await r.json();

        if(!data || !data.length) return "No podcasts";

        return data.map(p => `
            <div>
                <b>${p.name}</b>
                <div class="small">${p.author||""}</div>
            </div>
        `).join("");

    }catch{
        return "No podcasts";
    }
}

/* ---------------- LIVE TICKER ---------------- */

function startTicker(s){

    async function update(){

        const txt = await getProgram(s);

        ticker.innerText = "🔴 LIVE: " + txt;
    }

    update();
    setInterval(update, 30000);
}

/* ---------------- SEARCH ---------------- */

function setupSearch(){

    const input = document.getElementById("search");

    input.addEventListener("input", e => {

        const q = e.target.value.toLowerCase();

        document.querySelectorAll(".card").forEach(c => {

            c.style.display =
                c.innerText.toLowerCase().includes(q)
                ? "block"
                : "none";

        });

    });
}

/* ---------------- FAVORITES ---------------- */

function toggleFav(e,id){

    e.stopPropagation();

    if(favorites.includes(id)){
        favorites = favorites.filter(x=>x!==id);
    } else {
        favorites.push(id);
    }

    localStorage.setItem("fav", JSON.stringify(favorites));
}

/* ---------------- UTIL ---------------- */

function slug(t){
    return (t||"")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"_")
        .replace(/^_|_$/g,"");
}

</script>

</body>
</html>
