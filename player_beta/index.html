<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRDRT RADIO PWA</title>

<!-- HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    font-family:system-ui,Arial;
    background:#0b0b0b;
    color:#fff;
}

header{
    position:sticky;
    top:0;
    background:#121212;
    padding:10px;
    display:flex;
    gap:10px;
    align-items:center;
    z-index:10;
}

input{
    flex:1;
    padding:8px;
    border-radius:6px;
    border:none;
}

.container{
    padding:15px;
    max-width:1000px;
    margin:auto;
}

.card{
    background:#181818;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    cursor:pointer;
}

.section{
    background:#161616;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
}

select,button{
    padding:8px;
    border-radius:6px;
    border:none;
    margin:5px;
}

audio{ width:100%; }

#mini{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111;
    display:flex;
    gap:10px;
    padding:10px;
    align-items:center;
}

a{ color:#9ad; }

.small{ font-size:12px; color:#aaa; }

</style>
</head>

<body>

<header>
    🎧 KRDRT PWA
    <input id="search" placeholder="search stations...">
</header>

<div class="container" id="app">Loading...</div>

<div id="mini">
    <select id="streamSelect"></select>
    <button onclick="togglePlay()">▶</button>
    <audio id="player" controls></audio>
</div>

<script>

/* ================= STATE ================= */

let stations = [];
let hls = null;

const app = document.getElementById("app");
const player = document.getElementById("player");
const select = document.getElementById("streamSelect");

const params = new URLSearchParams(location.search);
const st = params.get("st");
const id = params.get("id");
const sub = params.get("sub_id");

/* ================= INIT ================= */

init();

async function init(){

    if(st){
        await loadStations();
        renderStation();
    } else {
        await loadStations();
        renderList();
    }

    setupSearch();
}

/* ================= LOAD ================= */

async function loadStations(){

    try{
        const res = await fetch(
`https://krdrtradio.github.io/player_beta/json/${st || "test"}_stations.json`
        );

        stations = await res.json();

    }catch(e){
        app.innerHTML = "Failed to load stations";
    }
}

/* ================= RESOLVE ================= */

function findStation(){

    if(!id) return null;

    for(const s of stations){

        if(s.id === id) return s;

        for(const l of (s.lists||[])){
            if(slug(l.name) === id){
                return {...s,...l};
            }
        }
    }

    return null;
}

/* ================= STREAM ENGINE ================= */

function initStreams(s){

    const streams = s.streams || {};
    const keys = Object.keys(streams);

    select.innerHTML = keys.map(k =>
        `<option value="${k}">${k}</option>`
    ).join("");

    const last = localStorage.getItem("stream_"+s.id);

    function load(type){

        const url = streams[type];
        if(!url) return;

        if(hls){
            hls.destroy();
            hls = null;
        }

        if(url.includes(".m3u8")){

            if(Hls.isSupported()){
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(player);
            } else {
                player.src = url;
            }

        } else {
            player.src = url;
        }

        player.play().catch(()=>{});
    }

    select.onchange = e => {
        localStorage.setItem("stream_"+s.id, e.target.value);
        load(e.target.value);
    };

    load(last || keys[0]);
}

/* ================= RENDER LIST ================= */

function renderList(){

    app.innerHTML = `
    <h2>Stations</h2>
    ${stations.map(s => `
        <div class="card" onclick="go('${s.id}')">
            <b>${s.name}</b>
            <div class="small">${s.frequency||""}</div>
        </div>
    `).join("")}
    `;
}

function go(id){
    location.href = `?st=${st}&id=${id}`;
}

/* ================= STATION PAGE ================= */

async function renderStation(){

    const s = findStation();

    if(!s){
        app.innerHTML = "Station not found";
        return;
    }

    initStreams(s);
    startNowPlaying(s);
    startProgram(s);

    const podcasts = await loadPodcasts(s);

    app.innerHTML = `
    <div class="section">
        <h2>${s.name}</h2>
        <div class="small">${s.frequency||""}</div>
    </div>

    <div class="section">
        <h3>Now Playing</h3>
        <div id="np">Loading...</div>
    </div>

    <div class="section">
        <h3>Program</h3>
        <div id="cp">Loading...</div>
    </div>

    <div class="section">
        <h3>Podcasts</h3>
        ${podcasts}
    </div>

    <div class="section">
        <h3>Links</h3>
        ${renderWebsites(s)}
    </div>
    `;
}

/* ================= PODCASTS ================= */

async function loadPodcasts(s){

    const key = s.podcast || s.podcasts;

    if(!key) return "No podcasts";

    try{
        const res = await fetch(
`https://podcasts.krdrtradio.workers.dev/?si=${key}`
        );

        const data = await res.json();

        if(!Array.isArray(data) || !data.length)
            return "No podcasts";

        return data.map(p => `
            <div>
                <b>${p.name}</b><br>
                <small>${p.author||""}</small>
            </div>
        `).join("");

    }catch{
        return "No podcasts";
    }
}

/* ================= NOW PLAYING ================= */

function startNowPlaying(s){

    if(!s.playlist_api) return;

    function run(){

        const match = s.playlist_api.match(/^(\w+)\(['"]?(.*?)['"]?\)$/);

        if(!match) return;

        const fn = match[1];
        const arg = match[2];

        if(window[fn]) window[fn](arg);
    }

    run();
    setInterval(run, 20000);
}

/* ================= PROGRAM ================= */

function startProgram(s){

    if(!s.schedule_api) return;

    const match = s.schedule_api.match(/^(\w+)\(['"]?(.*?)['"]?\)$/);

    if(!match) return;

    const fn = match[1];
    const arg = match[2];

    if(window[fn]) window[fn](arg);
}

/* ================= WEBSITES ================= */

function renderWebsites(s){

    const w = s.websites || {};

    return Object.entries(w).map(([k,v]) =>
        `<a href="${v}" target="_blank">${k}</a><br>`
    ).join("");
}

/* ================= SEARCH ================= */

function setupSearch(){

    document.getElementById("search").oninput = e => {

        const q = e.target.value.toLowerCase();

        document.querySelectorAll(".card").forEach(c => {
            c.style.display =
                c.innerText.toLowerCase().includes(q)
                ? "block"
                : "none";
        });
    };
}

/* ================= UTIL ================= */

function slug(t){
    return (t||"")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"_")
        .replace(/^_|_$/g,"");
}

/* ================= MINI PLAYER ================= */

function togglePlay(){
    if(player.paused) player.play();
    else player.pause();
}

/* ================= PWA ================= */

if("serviceWorker" in navigator){

    const sw = `
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('fetch',e=>{});
`;

    const blob = new Blob([sw],{type:"text/javascript"});
    const url = URL.createObjectURL(blob);

    navigator.serviceWorker.register(url);
}

</script>

</body>
</html>
