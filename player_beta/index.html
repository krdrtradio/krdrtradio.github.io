<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KRDRT Radio Player</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    background:#1b1b1b;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #333;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:#1d1d1d;
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
    text-decoration:none;
    color:white;
}

.card:hover{
    transform:translateY(-4px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#333;
}

.card-content{
    padding:15px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#aaa;
    font-size:14px;
}

.station{
    max-width:900px;
    margin:auto;
    background:#1d1d1d;
    border-radius:12px;
    overflow:hidden;
}

.station img{
    width:100%;
    height:350px;
    object-fit:cover;
    background:#333;
}

.station-content{
    padding:25px;
}

.station h1{
    margin-bottom:10px;
}

.frequency{
    color:#00d084;
    margin-bottom:15px;
}

.description{
    color:#ccc;
    line-height:1.6;
    margin-bottom:20px;
}

.meta{
    margin-bottom:25px;
    color:#999;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.btn{
    border:none;
    cursor:pointer;
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
}

.btn-play{
    background:#00c853;
}

.btn-m3u{
    background:#2979ff;
}

.btn-pls{
    background:#ff9100;
}

.btn-ram{
    background:#8e24aa;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#4da3ff;
    text-decoration:none;
}

.error{
    text-align:center;
    padding:50px;
    color:#ff6b6b;
}

.loading{
    text-align:center;
    padding:50px;
}

</style>
</head>
<body>

<header>
    <h1>KRDRT Radio Player</h1>
</header>

<div class="container">
    <div id="app" class="loading">
        Loading...
    </div>
</div>

<script>

const app = document.getElementById("app");

const params = new URLSearchParams(location.search);

const filename = params.get("st");
const selectedId = params.get("id");

if(!filename){

    app.innerHTML = `
        <div class="error">
            Missing parameter:
            <br><br>
            ?st=test
        </div>
    `;

}else{

    loadStations();

}

async function loadStations(){

    try{

        const url =
        `https://krdrtradio.github.io/player_beta/json/${filename}_stations.json`;

        console.log("Loading:",url);

        const response = await fetch(url);

        if(!response.ok){
            throw new Error("JSON not found");
        }

        const stations = await response.json();

        if(selectedId){

            const station =
                findStation(stations,selectedId);

            if(!station){

                app.innerHTML = `
                    <div class="error">
                        Station not found
                    </div>
                `;

                return;
            }

            renderStation(station);

        }else{

            renderList(stations);

        }

    }catch(error){

        console.error(error);

        app.innerHTML = `
            <div class="error">
                ${error.message}
            </div>
        `;
    }
}

function renderList(stations){

    let html = `
        <div class="grid">
    `;

    stations.forEach(station=>{

        if(station.disable) return;

        if(station.id){

            html += cardHtml(
                station.name,
                station.description,
                station.thumbnail_uri,
                `?st=${filename}&id=${station.id}`
            );
        }

        if(Array.isArray(station.lists)){

            station.lists.forEach(item=>{

                const itemId =
                    item.id ||
                    slug(item.name);

                html += cardHtml(
                    item.name,
                    item.description,
                    item.thumbnail_uri ||
                    station.thumbnail_uri,
                    `?st=${filename}&id=${itemId}`
                );

            });

        }

    });

    html += "</div>";

    app.innerHTML = html;
}

function cardHtml(name,desc,img,url){

    return `
        <a class="card" href="${url}">
            <img src="${img || 'https://placehold.co/600x400'}">

            <div class="card-content">

                <h3>${name || 'Unnamed'}</h3>

                <p>
                    ${desc || ''}
                </p>

            </div>
        </a>
    `;
}

function renderStation(station){

    app.innerHTML = `

    <a class="back"
       href="?st=${filename}">
       ← Back
    </a>

    <div class="station">

        <img src="${
            station.thumbnail_uri ||
            'https://placehold.co/1200x500'
        }">

        <div class="station-content">

            <h1>${station.name}</h1>

            <div class="frequency">
                ${station.frequency || ''}
            </div>

            <div class="description">
                ${station.description || ''}
            </div>

            <div class="meta">

                ${
                    station.category
                    ? `<div><b>Category:</b> ${
                        Array.isArray(station.category)
                        ? station.category.join(", ")
                        : station.category
                    }</div>`
                    : ''
                }

                ${
                    station.tags
                    ? `<div><b>Tags:</b> ${
                        Array.isArray(station.tags)
                        ? station.tags.join(", ")
                        : station.tags
                    }</div>`
                    : ''
                }

            </div>

            <div class="buttons">

                ${
                    station.stream_uri
                    ? `
                    <a
                        class="btn btn-play"
                        target="_blank"
                        href="${station.stream_uri}">
                        Open Stream
                    </a>
                    `
                    : ''
                }

                <button
                    class="btn btn-m3u"
                    onclick="downloadPlaylist('m3u')">
                    Download M3U
                </button>

                <button
                    class="btn btn-pls"
                    onclick="downloadPlaylist('pls')">
                    Download PLS
                </button>

                <button
                    class="btn btn-ram"
                    onclick="downloadPlaylist('ram')">
                    Download RAM
                </button>

            </div>

        </div>

    </div>
    `;

    window.currentStation = station;
}

function findStation(stations,id){

    for(const station of stations){

        if(station.disable) continue;

        if(station.id === id){
            return station;
        }

        if(Array.isArray(station.lists)){

            for(const item of station.lists){

                const itemId =
                    item.id ||
                    slug(item.name);

                if(itemId === id){

                    return {
                        ...station,
                        ...item
                    };
                }
            }
        }
    }

    return null;
}

function slug(text){

    return text
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,'_')
        .replace(/^_|_$/g,'');
}

function getEntries(station){

    const entries = [];

    if(!station.streams)
        return entries;

    if(station.streams.lq){

        entries.push({
            title:station.name,
            url:station.streams.lq
        });

    }

    if(station.streams.hq){

        entries.push({
            title:station.name + " HQ",
            url:station.streams.hq
        });

    }

    return entries;
}

function generateM3U(entries){

    let txt = "#EXTM3U\n\n";

    entries.forEach(e=>{

        txt +=
        `#EXTINF:-1,${e.title}\n`;

        txt +=
        `${e.url}\n\n`;

    });

    return txt;
}

function generatePLS(entries){

    let txt =
    "[playlist]\n";

    txt +=
    `NumberOfEntries=${entries.length}\n\n`;

    entries.forEach((e,i)=>{

        const n = i+1;

        txt +=
        `File${n}=${e.url}\n`;

        txt +=
        `Title${n}=${e.title}\n`;

        txt +=
        `Length${n}=-1\n\n`;

    });

    txt += "Version=2";

    return txt;
}

function generateRAM(entries){

    return entries
        .map(x=>x.url)
        .join("\n");
}

function downloadPlaylist(type){

    const station =
        window.currentStation;

    if(!station) return;

    const entries =
        getEntries(station);

    if(entries.length === 0){

        alert("No streams found");

        return;
    }

    let content = "";

    if(type==="m3u")
        content = generateM3U(entries);

    if(type==="pls")
        content = generatePLS(entries);

    if(type==="ram")
        content = generateRAM(entries);

    const blob =
        new Blob(
            [content],
            {type:"text/plain"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        (station.id ||
        slug(station.name))
        + "." + type;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}

</script>

</body>
</html>
