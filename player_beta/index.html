<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Radio OS PWA</title>

<!-- HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    font-family:system-ui,Arial;
    background:#0b0b0f;
    color:#fff;
}

header{
    position:sticky;
    top:0;
    background:#121218;
    padding:10px;
    display:flex;
    gap:10px;
    align-items:center;
    z-index:10;
}

input{
    flex:1;
    padding:8px;
    border-radius:6px;
    border:none;
    background:#222;
    color:#fff;
}

.container{
    padding:15px;
    max-width:1100px;
    margin:auto;
}

.card{
    background:#181820;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    cursor:pointer;
}

.card:hover{
    background:#22222c;
}

.section{
    background:#151520;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
}

select,button{
    padding:8px;
    border-radius:6px;
    border:none;
    margin:5px;
}

audio{ width:100%; }

#miniPlayer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111;
    display:flex;
    gap:10px;
    padding:10px;
    align-items:center;
    border-top:1px solid #333;
}

a{ color:#8af; text-decoration:none; }

.small{ font-size:12px; color:#aaa; }

.badge{
    font-size:11px;
    background:#333;
    padding:2px 6px;
    border-radius:6px;
}
</style>
</head>

<body>

<header>
    🎧 RADIO OS
    <input id="search" placeholder="Search stations..." />
</header>

<div class="container" id="app">Loading...</div>

<!-- MINI PLAYER -->
<div id="miniPlayer">
    <select id="streamSelect"></select>
    <button onclick="togglePlay()">▶</button>
    <audio id="player" controls></audio>
</div>

<script>

/* ================= STATE ================= */

let stations = [];
let hls = null;

const app = document.getElementById("app");
const player = document.getElementById("player");
const select = document.getElementById("streamSelect");

const params = new URLSearchParams(location.search);
const st = params.get("st");
const id = params.get("id");
const sub = params.get("sub_id");

/* ================= INIT ================= */

init();

async function init(){

    await loadStations();

    if(st && id){
        renderStation();
    } else if(st){
        renderStationList();
    } else {
        renderHome();
    }

    setupSearch();
}

/* ================= LOAD ================= */

async function loadStations(){

    try{
        const res = await fetch(
`https://krdrtradio.github.io/player_beta/json/${st}_stations.json`
        );

        stations = await res.json();

    }catch(e){
        app.innerHTML = "❌ Failed to load stations";
    }
}

/* ================= FIND ================= */

function findStation(){

    for(const s of stations){

        if(s.id === id) return s;

        for(const l of (s.lists || [])){
            if(slug(l.name) === id){
                return {...s, ...l};
            }
        }
    }

    return null;
}

/* ================= STREAM ENGINE ================= */

function initStreams(s){

    const streams = s.streams || {};
    const keys = Object.keys(streams);

    select.innerHTML = keys.map(k =>
        `<option value="${k}">${k}</option>`
    ).join("");

    const last = localStorage.getItem("stream_"+(s.id||id));

    function load(type){

        const url = streams[type];
        if(!url) return;

        if(hls){
            hls.destroy();
            hls = null;
        }

        if(url.includes(".m3u8")){

            if(Hls.isSupported()){
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(player);
            } else {
                player.src = url;
            }

        } else {
            player.src = url;
        }

        player.play().catch(()=>{});
    }

    select.onchange = e => {
        localStorage.setItem("stream_"+(s.id||id), e.target.value);
        load(e.target.value);
    };

    load(last || keys[0]);
}

/* ================= HOME ================= */

function renderHome(){

    app.innerHTML = `
    <h2>Categories</h2>
    ${stations.map(s => `
        <div class="card" onclick="go('${s.id}')">
            <b>${s.name}</b>
            <div class="small">${s.frequency||""}</div>
        </div>
    `).join("")}
    `;
}

function renderStationList(){

    app.innerHTML = `
    <h2>Stations</h2>
    ${stations.map(s => `
        <div class="card" onclick="go('${s.id}')">
            <b>${s.name}</b>
        </div>
    `).join("")}
    `;
}

function go(id){
    location.href = `?st=${st}&id=${id}`;
}

/* ================= STATION ================= */

async function renderStation(){

    const s = findStation();

    if(!s){
        app.innerHTML = "Station not found";
        return;
    }

    initStreams(s);

    const program = await getProgram(s);
    const podcasts = await getPodcasts(s);

    app.innerHTML = `
    <div class="section">
        <h2>${s.name}</h2>
        <div class="small">${s.frequency||""}</div>
    </div>

    <div class="section">
        <h3>🔴 Now Playing</h3>
        <div id="np">Loading...</div>
    </div>

    <div class="section">
        <h3>📡 Current Program</h3>
        <div id="cp">${program}</div>
    </div>

    <div class="section">
        <h3>🎧 Podcasts</h3>
        ${podcasts}
    </div>

    <div class="section">
        <h3>🌐 Links</h3>
        ${renderWebsites(s)}
    </div>
    `;

    bindLive(s);
}

/* ================= LIVE BIND ================= */

function bindLive(s){

    if(s.playlist_api)
        playlistNowPlaying(s.playlist_api);

    if(s.schedule_api)
        scheduleCurrent(s.schedule_api);

    renderProgramLive(s);
}

/* ================= PROGRAM ================= */

async function getProgram(s){

    try{
        if(!s?.schedule) return "Radio Plug";

        const url =
`https://current-program.krdrtradio.workers.dev/?si=${s.schedule.site}&st=${s.schedule.station}`;

        const r = await fetch(url);
        if(!r.ok) return "Radio Plug";

        const j = await r.json();

        return `${j.name||"No program"} - ${j.host||""}`;

    }catch{
        return "Radio Plug";
    }
}

function renderProgramLive(s){

    const el = document.getElementById("cp");
    if(!el) return;

    setInterval(async ()=>{
        el.innerText = await getProgram(s);
    }, 30000);
}

/* ================= PODCASTS ================= */

async function getPodcasts(s){

    const key = s.podcast || s.podcasts;
    if(!key) return "No podcasts";

    try{
        const r = await fetch(
`https://podcasts.krdrtradio.workers.dev/?si=${key}`
        );

        const j = await r.json();

        if(!Array.isArray(j) || !j.length)
            return "No podcasts";

        return j.map(p => `
            <div>
                <b>${p.name}</b>
                <div class="small">${p.author||""}</div>
            </div>
        `).join("");

    }catch{
        return "No podcasts";
    }
}

/* ================= NOW PLAYING ================= */

let playlistInterval = null;

function playlistNowPlaying(str){

    if(playlistInterval) clearInterval(playlistInterval);

    function run(){

        if(!str) return;

        const m = str.match(/^(\w+)\(['"]?(.*?)['"]?\)$/);

        if(m && window[m[1]])
            window[m[1]](m[2]);
    }

    run();
    playlistInterval = setInterval(run, 20000);
}

/* ================= SCHEDULE ================= */

function scheduleCurrent(str){

    if(!str) return;

    const m = str.match(/^(\w+)\(['"]?(.*?)['"]?\)$/);

    if(m && window[m[1]])
        window[m[1]](m[2]);
}

/* ================= WEBSITES ================= */

function renderWebsites(s){

    const w = s.websites || {};

    return Object.entries(w).map(([k,v]) =>
        `<a href="${v}" target="_blank">🔗 ${k}</a><br>`
    ).join("");
}

/* ================= SEARCH ================= */

function setupSearch(){

    document.getElementById("search").oninput = e => {

        const q = e.target.value.toLowerCase();

        document.querySelectorAll(".card").forEach(c=>{
            c.style.display =
                c.innerText.toLowerCase().includes(q)
                ? "block":"none";
        });
    };
}

/* ================= UTIL ================= */

function slug(t){
    return (t||"")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"_")
        .replace(/^_|_$/g,"");
}

/* ================= PLAYER ================= */

function togglePlay(){
    if(player.paused) player.play();
    else player.pause();
}

/* ================= PWA ================= */

if("serviceWorker" in navigator){

    const sw = `
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('fetch',()=>{});
`;

    const blob = new Blob([sw],{type:"text/javascript"});
    const url = URL.createObjectURL(blob);

    navigator.serviceWorker.register(url);
}

</script>

</body>
</html>
