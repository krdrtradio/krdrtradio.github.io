<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KRDRT Radio Player</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:#fff;
}

header{
    padding:20px;
    background:#181818;
    text-align:center;
    font-weight:bold;
    font-size:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

a{ color:inherit; text-decoration:none; }

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:15px;
}

.card{
    background:#1c1c1c;
    border-radius:10px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{ transform:scale(1.02); }

.card img{
    width:100%;
    height:140px;
    object-fit:cover;
}

.card-body{ padding:10px; }

h2,h3{ margin:10px 0; }

.small{ color:#aaa; font-size:13px; }

.section{
    margin-bottom:25px;
    padding:15px;
    background:#161616;
    border-radius:10px;
}

button{
    padding:10px 14px;
    margin:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.btn-blue{ background:#2979ff; color:#fff; }
.btn-orange{ background:#ff9800; color:#fff; }
.btn-purple{ background:#8e24aa; color:#fff; }

audio{ width:100%; margin-top:10px; }

.error{
    color:#ff5252;
    padding:20px;
}

</style>
</head>

<body>

<header>KRDRT RADIO PLAYER</header>

<div class="container" id="app">Loading...</div>

<script>

const app = document.getElementById("app");

const params = new URLSearchParams(location.search);

const st = params.get("st");
const id = params.get("id");
const sub_id = params.get("sub_id");

let STATIONS = [];

init();

async function init(){

    if(!st){
        renderHome();
        return;
    }

    await loadStations();

    if(!id){
        renderStationList();
        return;
    }

    const station = STATIONS.find(x => x.id === id);
    if(!station){
        app.innerHTML = "<div class='error'>Station not found</div>";
        return;
    }

    if(!sub_id){
        renderStation(station);
        return;
    }

    const item = resolveSubItem(station, sub_id);
    renderStation(item);
}

async function loadStations(){

    try{

        const res = await fetch(
            `https://krdrtradio.github.io/player_beta/json/${st}_stations.json`
        );

        STATIONS = await res.json();

    }catch(e){
        app.innerHTML = "<div class='error'>Failed to load JSON</div>";
    }
}

function slug(t){
    return (t||"")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"_")
        .replace(/^_|_$/g,"");
}

function resolveSubItem(station, sub_id){

    const item = (station.lists||[])
        .find(x => slug(x.name) === sub_id);

    if(!item) return station;

    return {
        ...station,
        ...item,
        streams: item.streams || station.streams,
        schedule: item.schedule || station.schedule,
        podcast: item.podcast || station.podcast
    };
}

/* ---------------- HOME ---------------- */

function renderHome(){
    app.innerHTML = `
        <div class="section">
            <h2>Categories</h2>
            <div class="small">Add ?st=test</div>
        </div>
    `;
}

/* ---------------- LIST ---------------- */

function renderStationList(){

    let html = `<h2>Stations</h2><div class="grid">`;

    STATIONS.forEach(s => {

        if(s.disable) return;

        html += `
        <a class="card" href="?st=${st}&id=${s.id}">
            <img src="${s.thumbnail_uri || ''}">
            <div class="card-body">
                <b>${s.name}</b>
                <div class="small">${s.frequency || ''}</div>
            </div>
        </a>`;
    });

    html += `</div>`;

    app.innerHTML = html;
}

/* ---------------- STATION ---------------- */

async function renderStation(s){

    const schedule = s.schedule;

    let program = "";

    // 1st method
    if(schedule){
        try{
            const url =
`https://current-program.krdrtradio.workers.dev/?si=${schedule.site}&st=${schedule.station}`;

            const r = await fetch(url);
            const j = await r.json();

            program = `
                <b>${j.name || "No program"}</b><br>
                ${j.host || ""}
            `;
        }catch{}
    }

    // fallback
    if(!program){
        program = "Radio Plug";
    }

    let podcastHtml = "";

    if(s.podcast){

        try{
            const r = await fetch(
`https://podcasts.krdrtradio.workers.dev/?si=${s.podcast}`
            );

            const data = await r.json();

            podcastHtml = (data||[]).map(p => `
                <div>
                    <b>${p.name}</b>
                    <div class="small">${p.author || ""}</div>
                </div>
            `).join("");

        }catch{}
    }

    const streams = s.streams || {};

    app.innerHTML = `

    <a href="?st=${st}&id=${id||s.id}">← Back</a>

    <div class="section">

        <h2>${s.name}</h2>

        <div class="small">${s.frequency || ""}</div>

        <p>${s.description || ""}</p>

    </div>

    <div class="section">
        <h3>Current Program</h3>
        ${program}
    </div>

    <div class="section">
        <h3>Audio</h3>

        ${streams.lq ? `
            <div>
                <b>LQ</b>
                <audio controls>
                    <source src="${streams.lq}">
                </audio>
            </div>` : ""}

        ${streams.hq ? `
            <div>
                <b>HQ</b>
                <audio controls>
                    <source src="${streams.hq}">
                </audio>
            </div>` : ""}
    </div>

    <div class="section">
        <h3>Podcasts</h3>
        ${podcastHtml || "No podcasts"}
    </div>

    <div class="section">
        <h3>Lists</h3>

        ${(s.lists||[]).map(l => `
            <a href="?st=${st}&id=${s.id}&sub_id=${slug(l.name)}">
                • ${l.name}
            </a><br>
        `).join("")}

    </div>

    `;
}

</script>

</body>
</html>
