<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio OS PWA</title>

<meta name="theme-color" content="#111111">

<link rel="manifest" href="manifest.json">

<style>

:root{
    --bg:#0b0b0f;
    --bg2:#15151d;
    --card:#1d1d27;
    --accent:#4da3ff;
    --text:#ffffff;
    --muted:#9aa0aa;
    --border:#2d2d39;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    padding-bottom:140px;
}

a{
    color:var(--accent);
    text-decoration:none;
}

header{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px 16px;

    background:#111;
    border-bottom:1px solid var(--border);
}

.logo{
    font-size:20px;
    font-weight:700;
}

.container{
    padding:12px;
}

.section{
    margin-bottom:20px;
}

.section h2,
.section h3{
    margin:0 0 12px;
}

.card{
    background:var(--card);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    border:1px solid transparent;
    transition:.2s;
}

.card:hover{
    border-color:var(--accent);
}

.station-card{
    display:flex;
    gap:12px;
}

.station-cover{
    width:72px;
    height:72px;
    border-radius:12px;
    background:#333;
    object-fit:cover;
}

.station-info{
    flex:1;
}

.station-name{
    font-weight:700;
    margin-bottom:4px;
}

.station-frequency{
    color:var(--muted);
    font-size:14px;
}

.station-desc{
    margin-top:6px;
    color:var(--muted);
    font-size:13px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:10px;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    background:#242430;
    color:#ddd;
    font-size:12px;
    margin:2px;
}

.small{
    font-size:13px;
    color:var(--muted);
}

.list-box{
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:10px;
}

.list-header{
    padding:12px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.list-items{
    border-top:1px solid var(--border);
}

.track{
    padding:10px 12px;
    border-top:1px solid var(--border);
}

.track.active{
    background:#263247;
}

.track button{
    margin-top:8px;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:30px;
}

#miniPlayer{
    position:fixed;
    left:0;
    right:0;
    bottom:60px;

    background:#111;
    border-top:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 14px;
    z-index:999;
}

#miniInfo{
    flex:1;
}

#miniActions{
    display:flex;
    gap:8px;
}

.btn{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    background:var(--accent);
    color:#fff;
}

.btn-secondary{
    background:#2a2a34;
}

audio{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    z-index:1000;
}

.loading{
    padding:30px;
    text-align:center;
}

.hidden{
    display:none;
}

</style>
</head>

<body>

<header>

    <div class="logo">
        🎧 Radio OS
    </div>

    <div>
        <button class="btn btn-secondary"
                onclick="goHome()">
            Home
        </button>
    </div>

</header>

<div id="app" class="container">

    <div class="loading">
        Ładowanie...
    </div>

</div>

<div id="miniPlayer">

    <div id="miniInfo">
        Brak odtwarzania
    </div>

    <div id="miniActions">

        <button class="btn"
                onclick="togglePlay()">
            ▶
        </button>

    </div>

</div>

<audio id="player" controls></audio>

<script src="site-nowplaying.js"></script>
<script>

/* ==================================================
   GLOBAL STATE
================================================== */

let stations = [];

let currentStation = null;

let currentTrack = null;

let openList = null;

let playlistInterval = null;

let hls = null;

/* ==================================================
   URL PARAMS
================================================== */

const params = new URLSearchParams(location.search);

const st = safe(params.get("st"));
const id = safe(params.get("id"));
const sub_id = safe(params.get("sub_id"));

function safe(v){

    return (
        !v ||
        v === "null" ||
        v === "undefined"
    )
        ? null
        : v;
}

/* ==================================================
   HELPERS
================================================== */

function slug(str){

    if(!str) return "item";

    let s = str
        .toString()
        .normalize("NFKD")                 // rozbicie znaków unicode
        .replace(/[\u0300-\u036f]/g, "")  // usuwa diakrytyki
        .replace(/[^a-zA-Z0-9]+/g, "_")    // wszystko inne → _
        .replace(/_+/g, "_")               // wiele _ → jedno
        .replace(/^_+|_+$/g, "")           // trim _
        .toLowerCase();

    // fallback jeśli pusty
    if(!s) {
        s = "item_" + Math.random().toString(36).slice(2, 7);
    }

    return s;
}

function goHome(){

    location.href = "./";
}

function normalizeArray(v){

    if(!v) return [];

    return Array.isArray(v)
        ? v
        : [v];
}

function pickStream(streams){

    if(!streams)
        return null;

    return (
        streams.hq ||
        streams.lq ||
        streams.normal ||
        streams.m3u8 ||
        Object.values(streams)[0]
    );
}

/* ==================================================
   INIT
================================================== */

init();

async function init(){

    await loadStations();

    await router();

}

/* ==================================================
   LOAD JSON
================================================== */

async function loadStations(){

    try{

        const file =
            `${st || "test"}_stations.json`;

        const response = await fetch(
            `https://krdrtradio.github.io/player_beta/json/${file}`
        );

        const json = await response.json();

        stations = (json || [])
            .filter(item => !item.disable);

    }catch(err){

        console.error(err);

        stations = [];
    }

}

/* ==================================================
   ROUTER
================================================== */

async function router(){

    if(!st){

        renderCategories();
        return;
    }

    if(st && !id){

        renderStations();
        return;
    }

    await renderStation();
}

/* ==================================================
   CATEGORIES
================================================== */

function renderCategories(){

    const app =
        document.getElementById("app");

    app.innerHTML = `

        <div class="section">

            <h2>Kategorie</h2>

            <div class="grid">

                <div class="card"
                     onclick="goCategory('test')">

                    <b>TEST</b>

                </div>

                <div class="card"
                     onclick="goCategory('test2')">

                    <b>TEST 2</b>

                </div>

                <div class="card"
                     onclick="goCategory('test3')">

                    <b>TEST 3</b>

                </div>

            </div>

        </div>

    `;
}

function goCategory(category){

    location.href =
        `?st=${encodeURIComponent(category)}`;
}

/* ==================================================
   STATIONS LIST
================================================== */

function renderStations(){

    const app =
        document.getElementById("app");

    if(!stations.length){

        app.innerHTML = `
            <div class="empty">
                Brak stacji
            </div>
        `;

        return;
    }

    app.innerHTML = `

        <div class="section">

            <h2>Stacje</h2>

            ${stations.map(station => {

                const sid =
                    station.id ||
                    slug(station.name);

                const firstList =
                    station.lists && station.lists[0]
                        ? station.lists[0]
                        : null;

                const subId =
                    firstList
                        ? (firstList.id || slug(firstList.name))
                        : null;

                return `

                    <div class="card station-card"
                         onclick="openStation('${sid}${subId ? `&sub_id=${subId}` : ""}')">

                        <img
                            class="station-cover"
                            src="${
                                station.thumbnail_uri ||
                                'https://dummyimage.com/200x200/333/fff.png&text=RADIO'
                            }"
                        />

                        <div class="station-info">

                            <div class="station-name">
                                ${station.name || ""}
                            </div>

                            <div class="station-frequency">
                                ${station.frequency || ""}
                            </div>

                            <div class="station-desc">
                                ${station.description || ""}
                            </div>

                            ${firstList ? `
                                <div class="small">
                                    ▶ ${firstList.name}
                                </div>
                            ` : ""}

                            ${renderTags(station)}

                        </div>

                    </div>

                `;

            }).join("")}

        </div>

    `;
}

/* ==================================================
   BADGES
================================================== */

function renderTags(station){

    let html = "";

    const categories =
        normalizeArray(
            station.category
        );

    const tags =
        normalizeArray(
            station.tags
        );

    categories.forEach(cat => {

        html += `
            <span class="badge">
                ${cat}
            </span>
        `;
    });

    tags.forEach(tag => {

        html += `
            <span class="badge">
                ${tag}
            </span>
        `;
    });

    return html;
}

/* ==================================================
   OPEN STATION
================================================== */

function openStation(stationId, listId){

    const url = new URL(location.href);

    url.searchParams.set("st", st);
    url.searchParams.set("id", stationId);

    if(listId){
        url.searchParams.set("sub_id", listId);
    }

    location.href = url;
}

/* ==================================================
   FIND STATION
================================================== */

function findStation(){

    for(const station of stations){

        const sid =
            station.id ||
            slug(station.name);

        if(sid === id){

            return {
                ...station,
                id: sid
            };
        }

        for(const list of (station.lists || [])){

            const lid =
                list.id ||
                slug(list.name);

            if(lid === id){

                return {
                    ...station,
                    ...list,
                    id: lid,
                    parentStation:
                        station.name
                };
            }
        }
    }

    return null;
}

/* ==================================================
   SOCIAL LINKS
================================================== */

function renderLinks(station){

    let html = "";

    const keys = [

        "website",
        "website_facebook",
        "website_instagram",
        "website_youtube",
        "website_tiktok",
        "website_x",
        "website_twitch",
        "website_kick",
        "website_soundcloud",
        "website_mixcloud",
        "website_spotify",
        "website_apple",
        "website_spreaker"

    ];

    keys.forEach(key => {

        if(!station[key])
            return;

        html += `

            <div>

                <a href="${station[key]}"
                   target="_blank">

                    ${key}

                </a>

            </div>

        `;
    });

    return html;
}

/* ==================================================
   CONTACTS
================================================== */

function renderContacts(station){

    const phones =
        normalizeArray(
            station.call
        );

    if(!phones.length)
        return "";

    return phones.map(phone => `

        <div>

            📞
            <a href="tel:${phone}">
                ${phone}
            </a>

        </div>

    `).join("");
}

/* ==================================================
   STATION VIEW
================================================== */

async function renderStation(){

    const app =
        document.getElementById("app");

    const station =
        findStation();

    if(!station){

        app.innerHTML = `
            <div class="empty">
                ❌ Station not found
            </div>
        `;

        return;
    }

    currentStation = station;

    const stream =
        pickStream(station.streams);

    if(stream){

        playStream(stream);
    }

    app.innerHTML = `

        <div class="section">

            <h2>${station.name || ""}</h2>

            <div class="small">
                ${station.frequency || ""}
            </div>

            <div class="small">
                ${station.description || ""}
            </div>

        </div>

        <div class="section">

            <h3>🔴 Now Playing</h3>

            <div id="nowPlaying">
                Ładowanie...
            </div>

        </div>

        <div class="section">

            <h3>📻 Program</h3>

            <div id="program">
                Ładowanie...
            </div>

        </div>

        <div class="section">

            <h3>🎧 Podcasts</h3>

            <div id="podcasts">
                Ładowanie...
            </div>

        </div>

        <div class="section">

            <h3>📡 Links</h3>

            ${renderLinks(station)}

        </div>

        <div class="section">

            <h3>📞 Contact</h3>

            ${renderContacts(station)}

        </div>

        ${renderLists(station)}

    `;

    await bindLive(station);

    updateMiniPlayer(station);

}

/* ==================================================
   STREAM PLAYER
================================================== */

function playStream(url){

    const audio =
        document.getElementById("player");

    if(!url)
        return;

    try{

        audio.src = url;

        audio.play().catch(()=>{});

    }catch(err){

        console.error(err);
    }

}

function togglePlay(){

    const audio =
        document.getElementById("player");

    if(audio.paused)
        audio.play();
    else
        audio.pause();
}

/* ==================================================
   LIVE BINDING
================================================== */

async function bindLive(station){

    if(station.schedule){

        loadProgram(station.schedule);
    }

    if(station.playlist_api){

        startPlaylistAPI(station.playlist_api);
    }

    loadPodcasts(station);

}

/* ==================================================
   PROGRAM (NOW SHOW)
================================================== */

async function loadProgram(schedule){

    const el =
        document.getElementById("program");

    try{

        const res = await fetch(
            `https://current-program.krdrtradio.workers.dev/?si=${schedule.site}&st=${schedule.station}`
        );

        const json = await res.json();

        el.innerHTML = `
            <b>${json.name || "Radio"}</b><br>
            <span class="small">${json.host || ""}</span>
        `;

    }catch(err){

        el.innerHTML = `
            Brak danych programu
        `;
    }
}

/* ==================================================
   PLAYLIST API (mock hook)
================================================== */

function startPlaylistAPI(apiString){

    if(playlistInterval)
        clearInterval(playlistInterval);

    const el = document.getElementById("nowPlaying");

    function setText(text){
        if(el) el.innerText = text || "";
    }

    function run(){

        try{

            if(!apiString) return;

            const match =
                apiString.match(/^(\w+)\(['"]?(.*?)['"]?\)$/);

            if(!match) return;

            const fn = match[1];
            const arg = match[2];

            if(typeof window[fn] === "function"){

                const result = window[fn](arg);

                // 👇 JEŚLI funkcja zwraca dane
                if(result){

                    const artist = result.artist || result.artysta || "";
                    const title = result.title || result.utwor || "";

                    setText(`${artist} - ${title}`.trim());
                } else {
                    setText("");
                }
            }

        }catch(err){

            console.error(err);
            setText("");
        }
    }

    run();

    playlistInterval =
        setInterval(run, 20000);
}

/* ==================================================
   PODCASTS
================================================== */

async function loadPodcasts(station){

    const el =
        document.getElementById("podcasts");

    const key =
        station.podcast ||
        station.podcasts;

    if(!key){

        el.innerHTML = "Brak podcastów";
        return;
    }

    try{

        const res = await fetch(
            `https://podcasts.krdrtradio.workers.dev/?si=${key}`
        );

        const json = await res.json();

        if(!Array.isArray(json) || !json.length){

            el.innerHTML = "Brak podcastów";
            return;
        }

        el.innerHTML = json.map(p => `

            <div class="card">

                <b>${p.name}</b>

                <div class="small">
                    ${p.author || ""}
                </div>

            </div>

        `).join("");

    }catch(err){

        el.innerHTML = "Błąd podcastów";
    }
}

/* ==================================================
   MINI PLAYER
================================================== */

function updateMiniPlayer(station){

    const el =
        document.getElementById("miniInfo");

    if(!el) return;

    el.innerHTML = `

        <b>${station.name || ""}</b><br>

        <span class="small">
            ${station.frequency || ""}
        </span>

    `;
}

/* ==================================================
   LISTS
================================================== */

function renderLists(station){

    if(!station.lists || !station.lists.length)
        return "";

    return `

        <div class="section">

            <h3>📚 Lists</h3>

            ${station.lists.map(list => {

                const lid =
                    list.id ||
                    slug(list.name);

                const open =
                    openList === lid;

                return `

                    <div class="list-box">

                        <div class="list-header"
                             onclick="toggleList('${lid}')">

                            <b>${list.name}</b>

                            <span>
                                ${open ? "▲" : "▼"}
                            </span>

                        </div>

                        ${open ? renderTracks(list) : ""}

                    </div>

                `;

            }).join("")}

        </div>

    `;
}

/* ==================================================
   TRACKS (SAFE)
================================================== */

function renderTracks(list){

    const tracks =
        list.tracks || [];

    if(!tracks.length){

        return `
            <div class="small" style="padding:10px;">
                Brak utworów
            </div>
        `;
    }

    return `

        <div class="list-items">

            ${tracks.map(t => {

                return `

                    <div class="track">

                        <b>${t.title || "Unknown"}</b>

                        <div class="small">
                            ${t.desc || ""}
                        </div>

                        ${t.stream ? `
                            <button class="btn"
                                onclick="playStream('${t.stream}')">
                                ▶ Play
                            </button>
                        ` : ""}

                    </div>

                `;

            }).join("")}

        </div>

    `;
}

/* ==================================================
   LIST TOGGLE FIX
================================================== */

function toggleList(id){

    openList = (openList === id) ? null : id;

    const url = new URL(location.href);

    if(openList){
        url.searchParams.set("sub_id", openList);
    } else {
        url.searchParams.delete("sub_id");
    }

    history.pushState({}, "", url);

    renderStation();
}

/* ==================================================
   FAVORITES (TRACKS)
================================================== */

function toggleFavoriteTrack(id){

    let fav =
        JSON.parse(
            localStorage.getItem("fav_tracks") || "[]"
        );

    if(fav.includes(id)){

        fav = fav.filter(x => x !== id);

    } else {

        fav.push(id);
    }

    localStorage.setItem(
        "fav_tracks",
        JSON.stringify(fav)
    );
}

/* ==================================================
   AUDIO EVENTS
================================================== */

(function bindAudioEvents(){

    const audio =
        document.getElementById("player");

    audio.addEventListener("play", () => {

        console.log("▶ playing");
    });

    audio.addEventListener("pause", () => {

        console.log("⏸ paused");
    });

})();

/* ==================================================
   SAFE INIT FIXES
================================================== */

function ensureMiniPlayer(){

    if(!document.getElementById("miniInfo")){

        const div =
            document.createElement("div");

        div.id = "miniInfo";

        div.style.display = "none";

        document.body.appendChild(div);
    }
}

ensureMiniPlayer();

/* ==================================================
   ERROR HANDLER
================================================== */

window.addEventListener("error", e => {

    console.warn("JS error:", e.message);

});

/* ==================================================
   PWA SERVICE WORKER
================================================== */

if("serviceWorker" in navigator){

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("sw.js")
            .then(reg => {

                console.log(
                    "SW registered:",
                    reg.scope
                );

            })
            .catch(err => {

                console.error("SW error:", err);
            });

    });

}

/* ==================================================
   OFFLINE FALLBACK
================================================== */

window.addEventListener("offline", () => {

    console.log("Offline mode");

});

window.addEventListener("online", () => {

    console.log("Back online");

});

/* ==================================================
   KEYBOARD SHORTCUTS
================================================== */

window.addEventListener("keydown", e => {

    if(e.code === "Space"){

        e.preventDefault();

        togglePlay();
    }

});

/* ==================================================
   CLEAN URL HELPERS
================================================== */

function updateUrl(params){

    const url =
        new URL(location.href);

    Object.entries(params).forEach(([k,v]) => {

        if(v === null){
            url.searchParams.delete(k);
        } else {
            url.searchParams.set(k,v);
        }
    });

    history.pushState({}, "", url);
}

/* ==================================================
   BACK BUTTON SUPPORT
================================================== */

window.addEventListener("popstate", () => {

    location.reload();
});

/* ==================================================
   FINAL ROUTER FIX
================================================== */

(async function boot(){

    await loadStations();

    await router();

})();

</script>

</body>
</html>
