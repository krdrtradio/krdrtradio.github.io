<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Radio OS v6</title>

<link rel="manifest" id="manifestLink" />
<meta name="theme-color" content="#111" />

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    font-family:system-ui,Arial;
    background:#0b0b0f;
    color:#fff;
}

header{
    position:sticky;
    top:0;
    background:#121218;
    padding:10px;
    display:flex;
    gap:10px;
    align-items:center;
}

input{
    flex:1;
    padding:8px;
    border-radius:6px;
    border:none;
    background:#222;
    color:#fff;
}

.container{
    padding:12px;
    max-width:1000px;
    margin:auto;
}

.card{
    background:#181820;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
    cursor:pointer;
}

.card:hover{ background:#22222c; }

.section{
    background:#151520;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
}

.small{ font-size:12px; color:#aaa; }

button,select{
    padding:8px;
    border-radius:6px;
    border:none;
    margin:4px;
}

audio{ width:100%; }

#miniPlayer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-top:1px solid #333;
}
</style>
</head>

<body>

<header>
🎧 RADIO OS v6
<input id="search" placeholder="Search..." />
</header>

<div class="container" id="app">Loading...</div>

<div id="miniPlayer">
    <div id="miniInfo">No station</div>
    <div>
        <button onclick="togglePlay()">▶</button>
        <button onclick="toggleFavorite()">❤️</button>
    </div>
</div>

<audio id="player" controls></audio>

<script>

/* ===================== STATE ===================== */

let stations = [];
let currentStation = null;
let hls = null;

/* ===================== ROUTER ===================== */

const params = new URLSearchParams(location.search);

const st = safe(params.get("st"));
const id = safe(params.get("id"));
const sub_id = safe(params.get("sub_id"));

function safe(v){
    return (!v || v === "null" || v === "undefined") ? null : v;
}

/* ===================== INIT ===================== */

init();

async function init(){

    await loadStations();

    if(!st){
        return renderCategories();
    }

    if(st && !id){
        return renderStations();
    }

    renderStation();
}

/* ===================== LOAD ===================== */

async function loadStations(){

    try{
        const file = `${st || "test"}_stations.json`;

        const res = await fetch(
`https://krdrtradio.github.io/player_beta/json/${file}`
        );

        stations = await res.json();

    }catch(e){
        stations = [];
    }
}

/* ===================== RENDER CATEGORIES ===================== */

function renderCategories(){

    app.innerHTML = `
        <h2>Categories</h2>

        <div class="card" onclick="go('test')">Test</div>
    `;
}

function go(cat){
    location.href = `?st=${cat}`;
}

/* ===================== RENDER STATIONS ===================== */

function renderStations(){

    app.innerHTML = `
        <h2>Stations</h2>

        ${stations.map(s => `
            <div class="card" onclick="openStation('${s.id || slug(s.name)}')">
                <b>${s.name}</b>
                <div class="small">${s.frequency||""}</div>
            </div>
        `).join("")}
    `;
}

function openStation(id){
    location.href = `?st=${st}&id=${id}`;
}

/* ===================== FIND ===================== */

function findStation(){

    for(const s of stations){

        if(s.id === id) return s;

        for(const l of (s.lists || [])){

            const lid = l.id || slug(l.name);

            if(lid === id){
                return {...s, ...l, id: lid};
            }
        }
    }

    return null;
}

/* ===================== STATION ===================== */

async function renderStation(){

    const s = findStation();

    if(!s){
        app.innerHTML = "Station not found";
        return;
    }

    currentStation = s;

    const stream = pickStream(s.streams || {});
    playStream(stream);

    const program = await getProgram(s);
    const podcasts = await getPodcasts(s);

    app.innerHTML = `
        <div class="section">
            <h2>${s.name}</h2>
            <div class="small">${s.frequency||""}</div>
        </div>

        <div class="section">
            <h3>🔴 Now Playing</h3>
            <div id="np">Loading...</div>
        </div>

        <div class="section">
            <h3>📻 Current Program</h3>
            <div>${program}</div>
        </div>

        <div class="section">
            <h3>🎧 Podcasts</h3>
            ${podcasts}
        </div>

<div class="section">
    <h3>📚 Lists</h3>
    ${(s.lists || []).map(l => {

        const sid = slug(l.name);
        const safeSt = (st && st !== "null") ? st : "test";
        const stationId  = s.id || id || slug(s.name);

        return `
            <a href="?st=${safeSt}&id=${encodeURIComponent(stationId)}&sub_id=${encodeURIComponent(sid)}">
                • ${l.name}
            </a><br>
        `;
    }).join("")}
</div>
    `;

    bindLive(s);
    updateMini(s);
}

/* ===================== STREAM ===================== */

function pickStream(streams){

    return streams.hq ||
           streams.lq ||
           streams.m3u8 ||
           Object.values(streams)[0];
}

function playStream(url){

    const audio = document.getElementById("player");

    if(hls){
        hls.destroy();
        hls = null;
    }

    if(url && url.includes(".m3u8") && window.Hls){

        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(audio);

    } else {
        audio.src = url;
    }

    audio.play().catch(()=>{});
}

/* ===================== PROGRAM ===================== */

async function getProgram(s){

    try{
        if(!s.schedule) return "Radio Plug";

        const r = await fetch(
`https://current-program.krdrtradio.workers.dev/?si=${s.schedule.site}&st=${s.schedule.station}`
        );

        const j = await r.json();

        return `${j.name || ""} - ${j.host || ""}`;

    }catch{
        return "Radio Plug";
    }
}

/* ===================== PODCASTS ===================== */

async function getPodcasts(s){

    const key = s.podcast || s.podcasts;
    if(!key) return "No podcasts";

    try{
        const r = await fetch(
`https://podcasts.krdrtradio.workers.dev/?si=${key}`
        );

        const j = await r.json();

        if(!Array.isArray(j) || !j.length)
            return "No podcasts";

        return j.map(p=>`
            <div>
                <b>${p.name}</b>
                <div class="small">${p.author||""}</div>
            </div>
        `).join("");

    }catch{
        return "No podcasts";
    }
}

/* ===================== LIVE ===================== */

function bindLive(s){

    if(s.playlist_api){
        playlistNowPlaying(s.playlist_api);
    }

    setInterval(async ()=>{
        const el = document.getElementById("np");
        if(el) el.innerText = "Live update...";
    }, 20000);
}

/* ===================== NOW PLAYING ===================== */

let playlistInterval = null;

function playlistNowPlaying(str){

    if(playlistInterval) clearInterval(playlistInterval);

    function run(){

        if(!str) return;

        const m = str.match(/^(\w+)\(['"]?(.*?)['"]?\)$/);

        if(m && window[m[1]]){
            window[m[1]](m[2]);
        }
    }

    run();
    playlistInterval = setInterval(run, 20000);
}

/* ===================== MINI PLAYER ===================== */

function updateMini(s){

    const el = document.getElementById("miniInfo");

    el.innerHTML = `
        <b>${s.name}</b><br>
        <span class="small">${s.frequency||""}</span>
    `;
}

function togglePlay(){
    const audio = document.getElementById("player");
    if(audio.paused) audio.play();
    else audio.pause();
}

/* ===================== FAVORITES ===================== */

function toggleFavorite(){

    if(!currentStation) return;

    let fav = JSON.parse(localStorage.getItem("fav")||"[]");

    if(fav.includes(currentStation.id)){
        fav = fav.filter(x=>x!==currentStation.id);
    } else {
        fav.push(currentStation.id);
    }

    localStorage.setItem("fav", JSON.stringify(fav));
}

/* ===================== SEARCH ===================== */

document.getElementById("search").oninput = e => {

    const q = e.target.value.toLowerCase();

    document.querySelectorAll(".card").forEach(c=>{
        c.style.display = c.innerText.toLowerCase().includes(q)
            ? "block":"none";
    });
};

/* ===================== UTIL ===================== */

function slug(t){
    return (t||"")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"_");
}

/* ===================== PWA ===================== */

const manifest = {
    name:"Radio OS v6",
    short_name:"RadioOS",
    start_url:"./",
    display:"standalone",
    background_color:"#0b0b0f",
    theme_color:"#111"
};

const blob = new Blob([JSON.stringify(manifest)],{type:"application/json"});
document.getElementById("manifestLink").href = URL.createObjectURL(blob);

if("serviceWorker" in navigator){

    const sw = `
self.addEventListener('install',()=>self.skipWaiting());
self.addEventListener('fetch',()=>{});
`;

    const blob = new Blob([sw],{type:"text/javascript"});
    const url = URL.createObjectURL(blob);

    navigator.serviceWorker.register(url);
}

</script>

</body>
</html>
