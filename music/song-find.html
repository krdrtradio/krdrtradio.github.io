<!DOCTYPE html>
<html>
   <head>
      <title>Znajdź piosenkę | KrdrtRadio</title>
      <script src="https://krdrtradio.github.io/site-head.js"></script>
      <link rel="stylesheet" href="https://krdrtradio.github.io/style-def.css">
      <link rel="stylesheet" href="https://krdrtradio.github.io/music/music-g.css">
   </head>
   <body>
      <div>
         <script src="https://krdrtradio.github.io/site-top.js"></script>
         <div class="overlay" id="overlay"></div>
         <main class="main-content">
            <script src="https://krdrtradio.github.io/site-tophead.js"></script>
            <section>
               <div id="song-search"></div>
            </section>
            <script src="https://krdrtradio.github.io/site-bottom.js"></script>
         </main>
      </div>
      <script src="https://krdrtradio.github.io/script.js"></script>
      <script src="https://krdrtradio.github.io/script-def.js"></script>
      <script>
// Pobieranie parametru "s" z adresu URL
const params = new URLSearchParams(window.location.search);
const search = params.get("s");

// Element, w którym zostanie wyświetlona zawartość
const container = document.getElementById("song-search");

// Sprawdzenie, czy podano parametr
if (!search) {
    container.innerHTML = `
        <h4>Brak wyszukiwanej frazy</h4>
        <p>Dodaj parametr <code>?s=Artysta - Utwór</code> do adresu URL.</p>
    `;
} else {
    const query = encodeURIComponent(search);

    container.innerHTML = `
        <h4>${search}</h4>

        <div class="music-links">
            <a target="_blank" rel="noopener noreferrer"
               href="https://www.youtube.com/results?search_query=${query}"
               title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>

            <a target="_blank" rel="noopener noreferrer"
               href="https://music.youtube.com/search?q=${query}"
               title="YouTube Music">
                <i class="fa-solid fa-music"></i>
            </a>

            <a target="_blank" rel="noopener noreferrer"
               href="https://open.spotify.com/search/${query}"
               title="Spotify">
                <i class="fa-brands fa-spotify"></i>
            </a>

            <a target="_blank" rel="noopener noreferrer"
               href="https://music.apple.com/pl/search?l=pl&term=${query}"
               title="Apple Music">
                <i class="fa-brands fa-apple"></i>
            </a>

            <a target="_blank" rel="noopener noreferrer"
               href="https://www.deezer.com/search/${query}/track"
               title="Deezer">
                <i class="fa-brands fa-deezer"></i>
            </a>

            <a target="_blank" rel="noopener noreferrer"
               href="https://tidal.com/search/tracks?q=${query}"
               title="TIDAL">
                <i class="fa-brands fa-tidal"></i>
            </a>
        </div>
    `;
}
      </script>
   </body>
</html>
